<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客已搬家 — SolYoung</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="1;url=../blog/">
<link rel="canonical" href="https://solyoung.top/blog/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23E87028'/%3E%3C/svg%3E">
<style>
:root{--bg:#F7F7F5;--ink:#1B1B19;--soft:#6D6D67;--line:rgba(27,27,25,.14);--accent:#E87028;--card:#FCFCFB;
  --font-ios:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;--d:var(--font-ios);--s:var(--font-ios);--b:var(--font-ios)}
:root[data-theme="dark"]{--bg:#121212;--ink:#EDEDED;--soft:#9F9F9F;--line:rgba(237,237,237,.13);--card:#1A1A1A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--b);padding:24px;text-align:center}
.box{max-width:460px}
.brand{font-family:var(--d);font-weight:800;font-size:17px;letter-spacing:.01em}
.brand .dot{color:var(--accent)}
h1{font-family:var(--s);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.4;margin:34px 0 14px}
p{color:var(--soft);font-size:14px;line-height:1.9;margin:0 0 30px}
.go{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:100px;padding:12px 24px;font-family:var(--d);font-size:11px;font-weight:700;letter-spacing:.12em;background:var(--card);transition:all .3s}
.go:hover{border-color:var(--accent);color:var(--accent);gap:16px}
.sub{display:block;margin-top:28px;font-family:var(--d);font-size:10px;letter-spacing:.16em;color:var(--soft)}
.sub a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="box">
  <div class="brand">SolYoung<span class="dot">.</span></div>
  <h1>「思考」已改名为「博客」</h1>
  <p>文章都搬到了新的独立页面，正在为你跳转。<br>如果没有自动跳转，点下面的按钮。</p>
  <a class="go" href="../blog/">前往博客 BLOG ↗</a>
  <span class="sub"><a href="../index.html">← 返回首页</a></span>
</div>
<script>
(function(){
  try{
    var t=localStorage.getItem('soyoung-theme');
    if(t) document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>
</body>
</html>
