<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思考 Thoughts — SolYoung</title>
<meta name="description" content="SolYoung 的思考、记录与沉淀下来的想法。">
<meta property="og:title" content="思考 Thoughts — SolYoung">
<meta property="og:description" content="SolYoung 的思考、记录与沉淀下来的想法。">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23E87028'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Archivo:wght@500;600;700&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root{
  --bg:#F4F0E7;--bg-soft:#EFEADF;--ink:#1D1A15;--ink-soft:#6B6455;--ink-faint:#9A927F;
  --line:rgba(29,26,21,.14);--accent:#E87028;--card:#FAF7F0;
  --ease:cubic-bezier(.22,1,.36,1);
  --font-display:'Archivo','Noto Sans SC',system-ui,sans-serif;
  --font-serif:'Noto Serif SC',Georgia,serif;
  --font-body:'Noto Sans SC','PingFang SC',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.container{max-width:920px;margin:0 auto;padding:0 24px}
.hd{position:sticky;top:0;z-index:50;background:rgba(244,240,231,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd-in{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand .dot{color:var(--accent)}
.back{font-family:var(--font-display);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);transition:color .3s}
.back:hover{color:var(--accent)}
.hero{padding:88px 0 0}
h1{font-family:var(--font-serif);font-weight:900;font-size:clamp(46px,9vw,82px);margin:14px 0 18px;letter-spacing:-.02em;line-height:.95}
h1 .accent{color:var(--accent)}
.grid{margin-top:54px;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,3vw,24px)}
.card{opacity:0;transform:translateY(18px);transition:opacity .5s var(--ease),transform .4s var(--ease);display:block;border:1px solid var(--line);border-radius:12px;padding:clamp(24px,3vw,30px);background:var(--card);transition:border-color .3s ease-out,transform .3s ease-out,opacity .5s var(--ease)}
.card.in{opacity:1;transform:none}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .date{font-family:var(--font-display);font-size:11px;letter-spacing:.16em;color:var(--ink-faint)}
.card h3{font-family:var(--font-serif);font-weight:600;font-size:22px;line-height:1.4;margin:14px 0 10px;color:var(--ink)}
.card p{color:var(--ink-soft);font-size:14px;line-height:1.8;margin:0}
.more{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-family:var(--font-display);font-size:11px;letter-spacing:.12em;color:var(--accent);transition:color .3s}
.card:hover .more{color:var(--ink)}
.ft{padding:76px 0 48px;text-align:center}
.ft .muted{font-size:12px;color:var(--ink-faint)}
.fail{color:var(--ink-faint);font-size:13px;padding:24px 4px}
@media(max-width:720px){.hero{padding:56px 0 0}.grid{grid-template-columns:1fr}.card h3{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="hd">
  <div class="container hd-in">
    <a class="brand" href="../index.html" aria-label="返回首页">Sol<span class="dot">.</span>Young</a>
    <a class="back" href="../index.html#notes">← 返回首页</a>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h1>THOUGHTS <span class="accent">·</span> 思考</h1>
  </section>
  <section class="grid" id="list" aria-live="polite"></section>
</main>

<footer class="ft">
  <div class="muted">© 2026 SolYoung · 持续更新</div>
</footer>

<script>
(function(){
  var list = document.getElementById('list');
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function render(items){
    if(!list) return;
    var pub = items.filter(function(p){ return p.published; })
      .slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
    if(!pub.length){ list.innerHTML='<p class="fail">还没有思考。</p>'; return; }
    list.innerHTML='';
    pub.forEach(function(n,i){
      var el=document.createElement('a');
      var href=(n.page||'').split('/').pop() || '#';   // thoughts/index.html 内相对路径
      el.href=href; el.className='card'; el.style.transitionDelay=(i*90)+'ms';
      el.innerHTML='<span class="date">'+esc(n.date)+'</span><h3>'+esc(n.title)+'</h3><p>'+esc(n.summary)+'</p>'+
        '<span class="more">阅读 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:12px;height:12px"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
      list.appendChild(el);
      var io=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
      },{threshold:.12});
      io.observe(el);
    });
  }
  if(list){
    fetch('../thoughts.json?v='+Date.now(),{cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(render)
      .catch(function(){ list.innerHTML='<p class="fail">思考需要在线访问加载。</p>'; });
  }
})();
</script>
</body>
</html>
