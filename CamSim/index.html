<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Camera Simulator — 摄影参数模拟器</title>
<meta name="description" content="根据你的相机、镜头和拍摄场景，生成可直接执行的摄影参数方案。" />
<meta name="theme-color" content="#FFFFFF" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='18' rx='3' fill='%231D1D1F'/%3E%3Ccircle cx='16' cy='16' r='5.2' fill='none' stroke='%23FFFFFF' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%23FFFFFF'/%3E%3Crect x='10' y='7' width='4' height='2.4' rx='1' fill='%231D1D1F'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Inter:wght@400;500;600;700&display=swap" />
<style>
/* ===== 设计 Token ===== */
:root{
  --bg:#FFFFFF; --fg:#1D1D1F; --sub:#6E6E73; --border:#D2D2D7;
  --bg2:#F5F5F7; --accent:#1D1D1F; --accent-fg:#FFFFFF;
  --ok:#1A7F37; --warn:#B2500E; --danger:#C0392B;
  --radius:14px; --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.05);
  --shadow-lg:0 10px 40px rgba(0,0,0,.10);
  --maxw:1080px;
  --nav-h:60px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
[data-theme="dark"]{
  --bg:#000000; --fg:#F5F5F7; --sub:#A1A1A6; --border:#2C2C2E;
  --bg2:#151517; --accent:#F5F5F7; --accent-fg:#1D1D1F;
  --ok:#4CC38A; --warn:#E8A04C; --danger:#E5604F;
  --shadow-sm:0 1px 2px rgba(255,255,255,.04),0 2px 8px rgba(0,0,0,.5);
  --shadow-lg:0 10px 40px rgba(0,0,0,.6);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  background:var(--bg); color:var(--fg); line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .3s var(--ease),color .3s var(--ease);
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit}
img{max-width:100%;display:block}

::selection{background:rgba(120,120,128,.25)}

/* 布局 */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

/* 导航 */
.nav{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--border);transition:background .3s var(--ease)}
[data-theme="dark"] .nav{background:rgba(0,0,0,.72)}
.nav-inner{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:16px}
.nav-brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;font-size:15px}
.nav-brand svg{width:22px;height:22px}
.nav-links{display:flex;gap:2px;align-items:center}
.nav-links button{font-size:13.5px;color:var(--sub);padding:8px 13px;border-radius:8px;font-weight:500;transition:color .2s,background .2s}
.nav-links button:hover{color:var(--fg);background:var(--bg2)}
.nav-links button.active{color:var(--fg);font-weight:600}
.nav-right{display:flex;gap:10px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--fg);background:var(--bg2);border:1px solid var(--border);transition:transform .15s var(--ease),background .2s}
.icon-btn:hover{background:var(--border)}
.icon-btn svg{width:18px;height:18px}
.nav-cta{font-size:13.5px;font-weight:600;background:var(--accent);color:var(--accent-fg);padding:9px 16px;border-radius:999px;transition:opacity .2s}
#themeBtn .i-moon{display:none}
[data-theme="dark"] #themeBtn .i-sun{display:none}
[data-theme="dark"] #themeBtn .i-moon{display:block}
.nav-cta:hover{opacity:.85}

/* 汉堡 */
.burger{display:none}

/* 通用区块 */
.section{padding:96px 0}
.section-tight{padding:64px 0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--sub);text-transform:none;margin-bottom:14px}
h1{font-size:clamp(40px,6vw,72px);font-weight:700;letter-spacing:-.035em;line-height:1.05}
h2{font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:-.025em;line-height:1.12}
h3{font-size:22px;font-weight:600;letter-spacing:-.02em}
.lead{font-size:clamp(16px,2vw,20px);color:var(--sub);line-height:1.6;max-width:560px}
.center{text-align:center}
.center .lead{margin:0 auto}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;border-radius:999px;font-size:15px;padding:14px 28px;background:var(--accent);color:var(--accent-fg);transition:opacity .2s,transform .12s var(--ease);border:none}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--bg2);color:var(--fg);border:1px solid var(--border)}
.btn.small{padding:9px 16px;font-size:13.5px}
.btn.sm-icon{padding:10px 16px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:17px;height:17px}

/* 卡片 */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s}
.card.clickable{cursor:pointer}
.card.clickable:hover{transform:translateY(-3px);box-shadow:var(--shadow-sm);border-color:var(--sub)}

/* 首页 Hero */
.hero{padding:120px 0 80px;text-align:center}
.hero .lead{margin:22px auto 38px}

/* 步骤（首页三块） */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px}
.step-card{padding:34px 30px;position:relative}
.step-num{font-size:15px;font-weight:700;color:var(--sub);letter-spacing:.05em}
.step-title{font-size:20px;font-weight:650;margin:16px 0 8px;letter-spacing:-.01em}
.step-desc{color:var(--sub);font-size:14.5px;line-height:1.6}

/* 结果示例卡（首页） */
.demo-wrap{margin-top:56px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.demo-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px;flex-wrap:wrap}
.demo-suite{display:flex;gap:18px;flex-wrap:wrap}
.demo-big{font-size:clamp(20px,3vw,26px);font-weight:700;letter-spacing:-.02em}
.demo-small{color:var(--sub);font-size:14px;margin-top:2px}
.why{font-size:15px;color:var(--fg);line-height:1.7}
.why b{color:var(--fg)}
.why-note{color:var(--sub)}

/* 现场问题 chips */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:40px;justify-content:center}
.chip{padding:11px 20px;border:1px solid var(--border);border-radius:999px;font-size:14px;font-weight:500;background:var(--bg);transition:border-color .2s,background .2s,transform .12s var(--ease)}
.chip:hover{border-color:var(--fg);transform:translateY(-1px)}

/* 三方案（首页） */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:56px}
.plan-card{padding:30px;position:relative}
.plan-tag{position:absolute;top:22px;right:22px;font-size:11.5px;font-weight:600;color:var(--sub);border:1px solid var(--border);padding:4px 9px;border-radius:999px}
.plan-name{font-size:19px;font-weight:650}
.plan-desc{color:var(--sub);font-size:13.5px;margin:8px 0 18px;min-height:40px}
.plan-row{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-top:1px solid var(--border)}
.plan-row span{color:var(--sub)}
.plan-row b{font-weight:600}

/* CTA 大区 */
.cta{padding:120px 0;text-align:center}
.cta h2{font-size:clamp(32px,5vw,54px);letter-spacing:-.03em;margin-bottom:32px}

/* ===== 视图 ===== */
.view{display:none;animation:fadeUp .5s var(--ease) both}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* ===== 模拟器 ===== */
.sim-shell{display:grid;grid-template-columns:220px 1fr;gap:36px;padding:48px 0 80px}
.sim-steps{position:sticky;top:calc(var(--nav-h) + 24px);align-self:start}
.sim-step{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;color:var(--sub);font-size:14px;cursor:pointer;transition:background .2s,color .2s}
.sim-step .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--border);flex:none}
.sim-step.done{color:var(--fg)}
.sim-step.done .dot{background:var(--fg);border-color:var(--fg)}
.sim-step.current{color:var(--fg);font-weight:600;background:var(--bg2)}
.sim-step.current .dot{background:var(--fg);border-color:var(--fg);box-shadow:0 0 0 3px var(--border)}
.sim-step .st{flex:1}
.sim-step .ck{opacity:0}
.sim-step.done .ck{opacity:1}

.sim-main{min-height:60vh}
.sim-head{margin-bottom:30px}
.sim-head h2{font-size:clamp(24px,3vw,34px);letter-spacing:-.02em}
.sim-head p{color:var(--sub);margin-top:8px;font-size:15px}

.search{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:0 14px;margin-bottom:22px;transition:border-color .2s}
.search:focus-within{border-color:var(--fg)}
.search svg{width:17px;height:17px;color:var(--sub)}
.search input{border:none;background:none;padding:14px 0;font-size:15px;width:100%;outline:none}
.search input::placeholder{color:var(--sub)}

/* 网格选择 */
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.pick{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;text-align:left;cursor:pointer;transition:border-color .15s,transform .12s var(--ease);position:relative}
.pick:hover{border-color:var(--sub);transform:translateY(-1px)}
.pick .pk-t{font-weight:600;font-size:15px;letter-spacing:-.01em}
.pick .pk-s{color:var(--sub);font-size:12.5px;margin-top:3px}
.pick .pk-b{color:var(--sub);font-size:12px;margin-top:6px;line-height:1.5}
.pick.selected{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.pick.selected .check{opacity:1}
.check{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--accent-fg);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.check svg{width:12px;height:12px}
.pick.multi{border-color:var(--border)}
.pick.multi.selected{box-shadow:0 0 0 1px var(--fg)}
.pick.small-card{display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 12px;min-height:84px}
.pick.small-card .pk-t{font-size:17px}

/* 镜头推荐条 */
.lens-hint{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:20px;font-size:14px;color:var(--sub);line-height:1.6}
.lens-hint b{color:var(--fg)}

/* 导航按钮 */
.sim-actions{display:flex;justify-content:space-between;gap:12px;margin-top:36px;flex-wrap:wrap}
.btn-row{display:flex;gap:12px}

/* 底部（移动） */
.mobile-bar{display:none}

/* 环境单选框组 */
.optgroup{margin-bottom:26px}
.optgroup-label{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.03em;margin-bottom:12px}
.optgroup .grid{margin-top:0}

/* 现场调整 */
.fix-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.fix-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px;cursor:pointer;transition:border-color .15s,transform .12s var(--ease)}
.fix-item:hover{border-color:var(--fg);transform:translateY(-2px)}
.fix-item h4{font-size:15px;font-weight:600;margin-bottom:8px}
.fix-item p{font-size:13px;color:var(--sub);line-height:1.6}

/* 结果页 */
.result-head{padding:56px 0 8px}
.result-kicker{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--sub);margin-bottom:16px}
.result-title{font-size:clamp(30px,4.5vw,48px);font-weight:700;letter-spacing:-.03em}
.result-meta{margin-top:14px;font-size:15px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.result-meta .sep{color:var(--border)}
.suite-switch{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:4px;margin:22px 0}
.suite-switch button{font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:999px;color:var(--sub);transition:background .2s,color .2s}
.suite-switch button.active{background:var(--accent);color:var(--accent-fg)}

.copy-bar{position:sticky;top:calc(var(--nav-h));z-index:40;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 0;margin-bottom:8px}
.copy-bar-inner{display:flex;gap:10px;flex-wrap:wrap}
.copy-btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;padding:10px 18px;border-radius:999px;background:var(--accent);color:var(--accent-fg);transition:opacity .2s}
.copy-btn:hover{opacity:.88}
.copy-btn.ghost{background:var(--bg2);color:var(--fg);border:1px solid var(--border)}
.copy-btn svg{width:16px;height:16px}
.copy-btn.copied{background:var(--ok);color:#fff}
.copy-spacer{flex:1}

/* 主参数卡 */
.main-params{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:28px 0}
.param-big{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:34px 28px;text-align:center}
.param-big .val{font-size:clamp(30px,4vw,44px);font-weight:700;letter-spacing:-.02em}
.param-big .lbl{margin-top:10px;color:var(--sub);font-size:13px;font-weight:600;letter-spacing:.04em}
.param-big .rng{margin-top:8px;font-size:12.5px;color:var(--sub);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:4px 12px;display:inline-block}

/* 参数网格表 */
.param-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:8px 0 4px}
.param-cell{background:var(--bg);padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;cursor:pointer;transition:background .15s}
.param-cell:hover{background:var(--bg2)}
.param-cell .l{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:5px}
.param-cell .v{font-size:18px;font-weight:650;letter-spacing:-.01em}
.param-cell .w{font-size:12.5px;color:var(--sub);margin-top:4px}
.param-why{display:none;font-size:13px;color:var(--sub);line-height:1.6;background:var(--bg2);border-top:1px solid var(--border);padding:10px 0}
.param-cell.open .param-why{display:block}
.param-cell.open{display:block;cursor:default}
.param-cell.open .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.chev{margin-top:2px;color:var(--sub);transition:transform .2s;flex:none}
.param-cell.open .chev{transform:rotate(180deg)}

/* 灯光示意 */
.light-diagram{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:26px;margin-top:8px}
.light-diagram h4{font-size:16px;font-weight:650;margin-bottom:6px}
.diagram{position:relative;height:220px;border:1px dashed var(--border);border-radius:12px;margin-top:18px;overflow:hidden}
.diagram .point{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;transform:translate(-50%,-50%)}
.diagram .point .name{font-size:11.5px;font-weight:600;background:var(--fg);color:var(--accent-fg);padding:3px 9px;border-radius:6px;white-space:nowrap}
.diagram .point .sub{font-size:11px;color:var(--sub);white-space:nowrap}
.diagram .line{position:absolute;height:1.5px;background:var(--sub);opacity:.5}
.light-desc{margin-top:16px;display:grid;gap:8px}
.light-desc .ld{display:flex;justify-content:space-between;font-size:13.5px;border-bottom:1px dashed var(--border);padding:7px 0}
.light-desc .ld span{color:var(--sub)}

/* 开拍前检查 */
.checklist{margin-top:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 28px}
.ck-item{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--fg)}
.ck-item .ico{color:var(--ok);flex:none}
.ck-item svg{width:16px;height:16px}

/* 免责声明 */
.disclaimer{margin-top:34px;padding:18px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;font-size:12.5px;color:var(--sub);line-height:1.7}

/* 方案保存/收藏 */
.preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px}
.preset-card{padding:26px;position:relative}
.preset-card h4{font-size:16px;font-weight:650;margin-bottom:4px}
.preset-card .pm{font-size:13px;color:var(--sub);margin-bottom:16px}
.preset-card .pp{font-size:14px;font-weight:650;background:var(--bg2);border-radius:9px;padding:10px 12px;letter-spacing:-.01em}
.preset-actions{display:flex;gap:8px;margin-top:16px}
.heart{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--border);color:var(--sub)}
.heart.fav{color:#e5484d;border-color:#e5484d}
.heart svg{width:16px;height:16px}

/* 设备库 */
.lib-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:28px}
.lib-filter{display:flex;gap:6px;flex-wrap:wrap}
.lib-filter button{font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;border:1px solid var(--border);color:var(--sub);transition:all .15s}
.lib-filter button.active{background:var(--fg);color:var(--accent-fg);border-color:var(--fg)}
.lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.device-card{padding:24px}
.device-card h4{font-size:16px;font-weight:650}
.device-card .brand{font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:12px}
.spec-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--border)}
.spec-row span{color:var(--sub)}
.spec-row b{font-weight:600}
.empty-state{text-align:center;padding:80px 20px;color:var(--sub)}
.empty-state h3{color:var(--fg);margin-bottom:8px}

/* 关于 */
.about-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:44px}
.about-card{padding:30px}
.about-card h4{font-size:17px;font-weight:650;margin-bottom:10px}
.about-card p{color:var(--sub);font-size:14.5px;line-height:1.7}
.stage-list{margin-top:40px;display:grid;gap:0}
.stage{display:grid;grid-template-columns:64px 1fr;gap:20px;padding:22px 0;border-top:1px solid var(--border)}
.stage .num{font-size:15px;font-weight:700;color:var(--sub)}
.stage h4{font-size:17px;font-weight:650;margin-bottom:6px}
.stage p{color:var(--sub);font-size:14px;line-height:1.6}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--accent-fg);padding:12px 22px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:120;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 分享视图 */
.share-box{max-width:640px;margin:60px auto;text-align:center}
.share-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:36px;margin-top:28px;text-align:left}
.share-card .big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.air-copy{display:flex;gap:10px;margin-top:26px;justify-content:center}

/* 加载 */
.analyzing{text-align:center;padding:80px 0}
.analyzing .ai{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.05em;margin-bottom:14px}
.analyzing .bar{width:220px;height:3px;background:var(--border);border-radius:2px;margin:18px auto 0;overflow:hidden}
.analyzing .bar i{display:block;height:100%;background:var(--fg);width:0;border-radius:2px;transition:width .5s var(--ease)}

/* 页脚 */
.footer{border-top:1px solid var(--border);padding:44px 0;margin-top:40px}
.footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--sub);font-size:13px}
.footer a{color:var(--sub)}
.footer a:hover{color:var(--fg)}

/* AI 输入 */
.ai-panel{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:24px}
.ai-panel textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:14.5px;min-height:90px;outline:none;resize:vertical;line-height:1.6}
.ai-panel textarea:focus{border-color:var(--fg)}
.ai-parse{margin-top:14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px 18px;font-size:14px;line-height:1.9}
.ai-parse .row{display:flex;gap:10px}
.ai-parse .k{color:var(--sub);min-width:64px;flex:none}
.ai-parse .v{font-weight:500}

/* ===== 响应式 ===== */
@media (max-width:900px){
  .nav-links{display:none}
  .burger{display:grid}
  .steps,.plans{grid-template-columns:1fr}
  .demo-wrap{grid-template-columns:1fr;padding:28px}
  .sim-shell{grid-template-columns:1fr;padding:32px 0 100px}
  .sim-steps{display:none}
  .grid.c4{grid-template-columns:repeat(2,1fr)}
  .grid.c3{grid-template-columns:repeat(2,1fr)}
  .main-params{grid-template-columns:1fr}
  .fix-grid{grid-template-columns:1fr}
  .param-grid{grid-template-columns:1fr}
  .preset-grid,.lib-grid,.about-grid{grid-template-columns:1fr}
  .checklist{grid-template-columns:1fr}
  .mobile-bar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:80;background:var(--bg);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));gap:10px;justify-content:space-between;align-items:center;backdrop-filter:saturate(180%) blur(14px)}
  .mobile-bar .btn{flex:1;justify-content:center}
  .mobile-bar .btn:first-child{flex:none;padding:12px 20px}
  .section{padding:64px 0}
}
@media (max-width:520px){
  .grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr 1fr}
  .demo-suite{flex-direction:column;gap:14px}
  .nav-brand span.hide-sm{display:none}
}
</style>

/* =========================================================
   工具函数
   ========================================================= */
const $ = s=>document.querySelector(s);
const $$ = s=>Array.from(document.querySelectorAll(s));
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const round2 = n=>Math.round(n*100)/100;
function fmtShutter(t){
  if(t<1) return "1/"+Math.round(1/t);
  if(t<2) return "1.5s";
  return t+"s";
}
function fmtAperture(n){ return "F"+ (Number.isInteger(n)?n:round2(n)); }
function fmtFocal(f){ return Array.isArray(f)?f.join("–")+"mm":f+"mm"; }
function fmtIso(v){ return v>=1000?(v/1000).toFixed(1).replace(/\.0$/,"")+"k":String(v); }
function sensorOf(cam){ return SENSORS[cam.ss]; }
function lensFocal(l){ return l?(Array.isArray(l.fl)?(l.fl[0]+l.fl[1])/2:l.fl):null; }
function lensMaxAp(l){ return l?l.ap:null; }

/* =========================================================
   状态（LocalStorage 持久化）
   ========================================================= */
const LS = {
  get(k,d){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
};
const Store = {
  theme: LS.get("cs_theme","light"),
  last: LS.get("cs_last",null),       // 最近一次生成的方案
  presets: LS.get("cs_presets",[]),   // 保存的方案
  favs: LS.get("cs_favs",[]),         // 收藏的方案 id
  sim: { camera:null, lens:null, scene:null, sub:null, env:{}, look:[], flash:null, expert:null }
};
function saveLast(p){ Store.last=p; LS.set("cs_last",p); }
function savePreset(p){
  const id="pr"+Date.now().toString(36);
  p.id=id; Store.presets=[p,...Store.presets]; LS.set("cs_presets",Store.presets); return id;
}
function delPreset(id){ Store.presets=Store.presets.filter(p=>p.id!==id); LS.set("cs_presets",Store.presets); }
function isFav(id){ return Store.favs.includes(id); }
function toggleFav(id){
  if(isFav(id)){ Store.favs=Store.favs.filter(x=>x!==id);} else { Store.favs.push(id);}
  LS.set("cs_favs",Store.favs);
}
function setTheme(t){
  Store.theme=t; document.documentElement.setAttribute("data-theme",t);
  LS.set("cs_theme",t);
  const mc=document.querySelector('meta[name="theme-color"]'); if(mc) mc.setAttribute("content", t==="dark"?"#000000":"#FFFFFF");
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1500);
}
async function copyText(text, btn){
  try{
    await navigator.clipboard.writeText(text);
    flashCopy(btn); toast("参数已复制到剪贴板");
  }catch(e){
    // 备用：回退文本域
    const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); flashCopy(btn); toast("参数已复制到剪贴板"); }
    catch(e2){ toast("请长按复制"); }
    document.body.removeChild(ta);
  }
}
function flashCopy(btn){
  if(!btn) return; const old=btn.innerHTML;
  btn.classList.add("copied"); btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5 9-10"/></svg>已复制';
  setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML=old; },1500);
}

  const h=location.hash.replace(/^#\/?/,"");
  const parts=h.split("/");
  ROUTE={view:(parts[0]||"home")||"home", param:parts[1]||null};
}
function navigate(view,param){
  location.hash="/"+(param?view+"/"+param:view);
}

/* =========================================================
   EXPOSURE ENGINE（基于 EV 的真实曝光计算）
   ========================================================= */
const hasLook=(c,l)=>c.looks.includes(l);
function recommendedFocal(sub){ const f=CAT_FOCAL[sub]; return f?f[0]:35; }
function fixedAp(cam){ if(!cam.fixed) return null; const m=String(cam.fixed).match(/F([\d.]+)/); return m?parseFloat(m[1]):null; }
function camSync(cam){ if(typeof cam.sync==="string"){ const p=cam.sync.split("/"); return parseInt(p[0])/parseInt(p[1]); } return cam.sync; }
function isoFor(ap,t,ev){ return 100*Math.pow(2, Math.log2(ap*ap/t)-ev); }
function isStillScene(ctx){
  const slow=["长曝光","瀑布","星空","银河","星轨","星空人像","夜景","城市夜景","蓝调时刻","烟花","灯光节","建筑夜景"];
  if(ctx.looks.includes("blur")) return true;
  if(slow.includes(ctx.sub)) return true;
  if(ctx.cat==="产品"||ctx.cat==="微距") return true;
  return false;
}
function estimateDist(cat,sub){
  if(cat==="人像"||cat==="婚礼") return 2.5;
  if(cat==="产品") return 0.8;
  if(cat==="微距") return 0.35;
  if(cat==="食物") return 1;
  if(cat==="街头") return 5;
  if(cat==="野生动物") return 25;
  if(cat==="宠物") return 2;
  if(cat==="视频") return 1.5;
  if(cat==="星空"||cat==="风景"||cat==="建筑") return 60;
  if(cat==="舞台"||cat==="活动") return 15;
  if(cat==="运动") return 20;
  return 4;
}
const AP_DEFAULT={人像:2.8,产品:8,风景:8,建筑:8,街头:4,食物:2.8,运动:4,宠物:2.8,旅行:4,夜景:2.8,星空:2,舞台:2.8,活动:4,婚礼:2.8,微距:8,野生动物:5.6,视频:2.8};
function apertureFor(ctx,mode,maxAp){
  const cat=ctx.cat, shallow=hasLook(ctx,"shallow")||hasLook(ctx,"cinematic"), deep=hasLook(ctx,"deep");
  const wide=["人像","宠物","食物","街头","旅行","婚礼","舞台","活动","视频"];
  let ap;
  if(shallow) ap=maxAp;
  else if(deep||["风景","建筑","产品","星空","微距"].includes(cat)){
    if(cat==="星空") ap=2;
    else if(cat==="微距") ap=8;
    else ap=deep?11:8;
  } else ap=AP_DEFAULT[cat]||4;
  if(mode==="effect"&&!shallow&&wide.includes(cat)) ap=maxAp;
  if(mode==="quality"&&!deep&&!["风景","建筑","产品","星空","微距"].includes(cat)) ap=round2(Math.min(maxAp*2,8));
  return round2(ap);
}
function shutterFor(ctx,mode){
  const cam=ctx.cam, ibis=cam.ibis||0;
  const fl=(ctx.focal||50)*(sensorOf(cam).crop);
  const hh=ibis>0? Math.max(1/(fl*Math.pow(2,Math.min(ibis,5))),1/8) : 1/fl;
  const freeze=hasLook(ctx,"freeze"), blur=hasLook(ctx,"blur");
  if(ctx.cat==="星空") return mode==="quality"?25:15;
  if(isSlowSceneOnly(ctx)) return mode==="effect"? 4 : (mode==="quality"? 30: 2);
  if(blur) return mode==="effect"?1/8:1/4;
  if(freeze||ctx.cat==="运动") return 1/1000;
  if(ctx.cat==="野生动物") return 1/500;
  if(ctx.cat==="舞台"||ctx.cat==="活动") return 1/250;
  if(ctx.cat==="宠物") return freeze?1/500:1/250;
  if(ctx.cat==="视频") return 1/(2*(ctx.fps||30));
  if(ctx.cat==="人像"||ctx.cat==="婚礼"||ctx.cat==="旅行") return freeze?1/500:1/125;
  if(ctx.cat==="产品"||ctx.cat==="食物"||ctx.cat==="微距") return freeze?1/250:1/125;
  if(ctx.cat==="街头") return freeze?1/500:1/250;
  if(ctx.cat==="建筑") return mode==="quality"?2:1/60;
  if(ctx.cat==="风景") return mode==="quality"?2:1/125;
  if(mode==="quality"&&isStillScene(ctx)) return 2;
  return Math.max(hh,1/60);
}
function isSlowSceneOnly(ctx){
  return ["长曝光","瀑布","星轨","星空人像","烟花"].includes(ctx.sub);
}
function parseShutter(s){ if(typeof s==="string"&&s.includes("/")){ const p=s.split("/"); return parseInt(p[0])/parseInt(p[1]);} if(typeof s==="number") return s; return 1/8000; }
function computePlan(ctx,mode){
  const cam=ctx.cam, base=cam.iso[0];
  const maxIso=(cam.iso[1]||25600);
  const maxAp=lensMaxAp(ctx.lens)||fixedAp(cam)||1.8;
  const shallow=hasLook(ctx,"shallow")||hasLook(ctx,"cinematic");
  let ap=apertureFor(ctx,mode,maxAp);
  ap=Math.max(ap,maxAp); /* 不得小于镜头最大光圈 */
  let t=shutterFor(ctx,mode);
  const isoCap = mode==="effect"? maxIso : (mode==="quality"? base*4 : 3200);
  const still=isStillScene(ctx);
  /* 静物/三脚架场景不允许为快门把 ISO 拉到极限，过暗就慢门 */
  const effCap = (still && !hasLook(ctx,"freeze")) ? Math.min(isoCap,800) : isoCap;
  const maxShutter=parseShutter(cam.shutter);
  let iso=isoFor(ap,t,ctx.ev);
  if(iso>effCap){
    // 太暗：优先压慢快门（主体静止），否则开大光圈
    if(still){
      const needT=ap*ap/Math.pow(2, ctx.ev+Math.log2(effCap/100));
      if(needT<=60) t=Math.max(needT, maxShutter);
    } else if(ap>maxAp/1.15){ ap=round2(Math.max(ap/Math.SQRT2,maxAp)); }
    iso=isoFor(ap,t,ctx.ev);
    if(iso>effCap && ap>maxAp/1.15){ ap=round2(Math.max(ap/Math.SQRT2,maxAp)); iso=isoFor(ap,t,ctx.ev); }
    iso=Math.min(iso,effCap);
  } else if(iso<base){
    // 太亮：提高快门直到基准 ISO
    const needT=ap*ap/Math.pow(2, ctx.ev+Math.log2(base/100));
    t=Math.max(needT, maxShutter);
    iso=isoFor(ap,t,ctx.ev);
    iso=Math.max(base,iso);
  }
  iso=Math.round(iso);
  const lo=Math.max(base, Math.round(iso/2));
  const hi=Math.min(maxIso, Math.round(iso*2));
  /* 闪灯曝光：快门锁同步速度，曝光由灯功率/光圈/ISO 决定，不走环境光慢门 */
  if(ctx.flash && ctx.flash.id!=="none" && ctx.cat!=="视频"){
    const syncT=camSync(cam)||(1/160);
    t=syncT;
    iso=Math.max(base, Math.min(base*4, iso));
  }
  return {ap,t,iso,range:[lo,hi]};
}

/* ===== DOF ENGINE ===== */
function dofEngine(N,f,dist,coc){
  if(!f||!N) return {near:null,far:null,hyper:null};
  const fmm=f; const Hm=fmm*fmm/(N*coc)/1000;
  if(dist>=Hm) return {near:Hm/2,far:Infinity,hyper:Hm};
  const near=Hm*dist/(Hm+dist), far=Hm*dist/(Hm-dist);
  return {near,far,hyper:Hm};
}
function fmtDist(m){ if(m==null) return "—"; if(m>=Infinity||!isFinite(m)) return "∞"; if(m>=1000) return round2(m/1000)+"m"; return m<1? Math.round(m*100)+"cm": round2(m)+"m"; }

/* ===== FLASH ENGINE ===== */
function flashDist(sub){ return estimateDist((catOfSub(sub)||"人像"),sub); }
function catOfSub(sub){ for(const c of SCENES){ if(c.subs.includes(sub)) return c.name;} return null; }
function flashInfo(ctx,ap,iso,t){
  const f=ctx.flash; if(!f||f.id==="none") return null;
  const dist=flashDist(ctx.sub);
  const gn=f.gn||60;
  const need=Math.pow(ap*dist/(gn*Math.sqrt(iso/100)),2);
  let power,note=null;
  if(need>1){ power=null; note="当前光圈下光量不足：请提高 ISO、拉近灯距，或使用更大功率灯/双灯。"; }
  else{ const levels=[1,1/2,1/4,1/8,1/16,1/32,1/64,1/128];
    power=levels.find(x=>x>=need)||levels[levels.length-1]; }
  const syncT=camSync(ctx.cam);
  const hss = t<syncT ? "ON":"OFF";
  return {dist, power, need, hss, mode:"TTL", note, modifier: modifierSug(ctx.sub)};
}
function modifierSug(sub){
  if(sub==="珠宝"||sub==="金属"||sub==="玻璃") return "柔光箱 + 反光板/黑色吸光板";
  if(sub==="产品"||sub.includes("产品")) return "柔光箱 + 反光板";
  if(sub==="人像"||sub==="婚纱外景"||sub==="室外人像") return "柔光箱（或反光伞）";
  if(catOfSub(sub)==="微距") return "环形灯 / 双闪微距";
  return "柔光箱";
}

/* ===== VIDEO ENGINE ===== */
const ND_OPTS=[[2,"ND4"],[3,"ND8"],[4,"ND16"],[5,"ND32"],[6,"ND64"],[8,"ND256"]];
function videoEngine(ctx){
  const fps=ctx.fps||30;
  const t=1/(2*fps); // 180° 快门法则
  const base=ctx.cam.iso[0];
  const maxAp=lensMaxAp(ctx.lens)||fixedAp(ctx.cam)||1.8;
  let ap=hasLook(ctx,"shallow")||hasLook(ctx,"cinematic")? maxAp : (hasLook(ctx,"deep")?4:2.8);
  let iso=isoFor(ap,t,ctx.ev);
  // ND 计算：若以 base iso + 固定快门仍过曝，需 ND
  const brightStops=(ctx.ev + Math.log2(base/100)) - Math.log2(ap*ap/t);
  let nd=null;
  if(brightStops>1.2){
    nd=ND_OPTS.reduce((a,b)=> Math.abs(b[0]-brightStops)<Math.abs(a[0]-brightStops)?b:a);
  }
  iso=Math.max(base,Math.min(iso,ctx.cam.iso[1]||25600));
  return {fps,t,ap,iso,nd,ndStops:brightStops};
}

/* =========================================================
   RULE ENGINE → 组装三套方案
   ========================================================= */
function wbSuggestion(cat,tmpl,answers){
  if(cat==="视频"||cat==="星空") return [3800,"Custom"];
  const time=answers&&answers.time, light=answers&&answers.light, scene=answers&&answers.scene;
  if(answers&&answers.light==="flash") return [5500,"Flash 闪光灯"];
  if(answers&&answers.scene==="street"||time==="night") return [3800,"Tungsten / Custom"];
  if(time==="golden") return [5200,"Daylight 日光"];
  if(time==="blue"||time==="dawn"||time==="dusk"||time==="evening") return [5200,"Daylight 日光"];
  const w=answers&&answers.weather;
  if(w==="overcast"||w==="rain") return [6000,"Cloudy 阴天"];
  if(w==="cloudy") return [5800,"Cloudy 多云"];
  if(light==="lamp"||light==="mixed") return [4000,"Custom 混合光"];
  if(light==="continuous"||scene==="indoor"||scene==="interview") return [3200,"Tungsten 白炽灯"];
  return [5500,"Daylight 日光"];
}
function focusSuggestion(ctx){
  const cat=ctx.cat;
  if(cat==="视频") return "AF-C 连续 + 眼部追踪";
  if(cat==="人像"||cat==="婚礼"||cat==="宠物") return ctx.cam.eye? "AF-C + 眼部对焦":"AF-C 连续";
  if(cat==="运动"||cat==="野生动物"||cat==="舞台") return "AF-C + 主体跟踪";
  if(cat==="星空") return "手动对焦（∞/峰值）";
  if(cat==="微距") return "手动对焦 / AF-S";
  return "AF-S 单次对焦";
}
function meteringSuggestion(ctx,answers){
  const dir=answers&&answers.dir;
  if(dir==="back") return "点测光（对主体）";
  if(ctx.cat==="舞台"||ctx.cat==="星空") return "点测光";
  if(ctx.cat==="产品") return "手动测光 / 点测光";
  if(ctx.cat==="人像"||ctx.cat==="婚礼") return "多重测光 + 曝光补偿";
  return "多重 / 评价测光";
}
function tripodSuggestion(ctx,mode){
  if(ctx.cat==="星空"||ctx.cat==="视频"&&ctx.sub==="慢动作") return true;
  if(isStillScene(ctx)) return true;
  if(mode==="quality"&&["风景","建筑","产品","微距"].includes(ctx.cat)) return true;
  return false;
}
function checklist(ctx){
  const items=["电池","存储卡","RAW格式","白平衡","防抖开关"];
  if(ctx.looks.includes("freeze")||ctx.cat==="运动") items.push("高快门优先");
  if(ctx.flashRequired&&ctx.flash&&ctx.flash.id!=="none") items.push("闪光灯电量 / 无线同步");
  if(ctx.cat==="星空"||ctx.cat==="视频") items.push("三脚架 / 稳定器");
  if(ctx.cat==="视频") items.push("ND滤镜","收音设备");
  if(ctx.sub==="瀑布"||ctx.sub==="长曝光") items.push("ND滤镜","三脚架","快门线/自拍");
  return items;
}
function buildAllPlans(store, expert){
  const cam=CAMERAS.find(c=>c.id===store.camera);
  const lens=store.lens?LENSES.find(l=>l.id===store.lens):null;
  const cat=catOfSub(store.sub)||"人像";
  const tmpl=ENV_T[envTypeOf(cat,store.sub)];
  const ev=tmpl.base==null? null : (tmpl.base + Object.entries(store.env||{}).reduce((s,[k,v])=>{
    const q=tmpl.q.find(q=>q.k===k); if(!q) return s; const op=q.o.find(o=>o[0]===v); return s+(op?op[2]||0:0);
  },0));
  const flashInEnv = Object.values(store.env||{}).some(v=>v==="flash");
  const flashRequired = ev==null || flashInEnv;
  const evSafe = ev==null? 5 : (flashInEnv? 4 : ev);
  const fps = store.env&&store.env.fps? parseInt(store.env.fps):30;
  let flash=null;
  if(flashRequired){ flash = store.flash? FLASHES.find(f=>f.id===store.flash) : FLASHES[1]; }
  const baseCtx={cam,lens,focal:lensFocal(lens)||recommendedFocal(store.sub),cat,sub:store.sub,
    looks:store.look,env:store.env,ev:evSafe,flashRequired,fps,flash,expert};
  const camName=(cam?cam.brand+" "+cam.model:null);
  const lensName=lens?lens.model : (cam&&cam.fixed?cam.fixed:(store.sub?("推荐 "+recommendedFocal(store.sub)+"mm"):"未选"));
  const wb=wbSuggestion(cat,tmpl,store.env);
  const dist=estimateDist(cat,store.sub);
  const coc=sensorOf(cam).coc;
  const focus=focusSuggestion(baseCtx);
  const meter=meteringSuggestion(baseCtx,store.env);

  const plans=[];
  const specs=[
    ["natural","自然稳妥","均衡可靠，适合直接拍摄",cam.iso[0]&&1],
    ["quality","画质优先","最低 ISO，画质纯净",1],
    ["effect","效果优先","最大化实现你要的效果",1]
  ];
  for(const [key,name,desc,aim] of specs){
    const ctx=Object.assign({},baseCtx);
    // 专家模式覆盖
    if(expert){
      if(expert.ap) ctx.looks=Object.assign([],ctx.looks).concat(expert.shallow?[]:[]);
    }
    const {ap,t,iso,range}=computePlan(ctx,key);
    const sensor=sensorOf(cam);
    const dof=dofEngine(ap,ctx.focal||50,dist,coc);
    const flash=flashInfo(ctx,ap,iso,t);
    const tripod=tripodSuggestion(ctx,key);
    const vid = ctx.cat==="视频"? videoEngine(ctx):null;
    const wa= whyAperture(cat,store.sub,ap,hasLook(ctx,"shallow"));
    const ws = whyShutter(ctx,t);
    const wi = whyIso(ctx,iso);
    const plan={
      key, name, desc, cam:camName, camId:store.camera, lens:lensName,
      cat, sub:store.sub, env:store.env,
      aperture:ap, shutter:t, iso, isoRange:range, wb:wb[0], wbLabel:wb[1],
      focus, meter, file:"RAW", flash, tripod, dof, dist, vid, nd:vid&&vid.nd,
      conditions: condText(store.env, tmpl),
      why:{aperture:wa, shutter:ws, iso:wi},
      checklist: checklist(ctx)
    };
    if(vid){ const vMaxAp=lensMaxAp(ctx.lens)||1.8; plan.aperture=Math.max(vid.ap, vMaxAp); plan.shutter=vid.t; plan.iso=vid.iso; plan.isoRange=[Math.max(cam.iso[0],Math.round(vid.iso/2)),Math.min(cam.iso[1]||25600,Math.round(vid.iso*2))]; }
    plans.push(plan);
  }
  return {plans, cam, lens, camName, lensName, cat, sub:store.sub, ev, wb, focus, meter, dist, coc, flashRequired, baseCtx, envT:tmpl, conditions:condText(store.env,tmpl)};
}
function whyAperture(cat,sub,ap,shallow){
  if(shallow) return "为获得明显背景虚化，光圈开到可用最大值（F"+ap+"）。若现场锐度要求更高，可收 1/3 档。";
  if(cat==="星空") return "F"+ap+" 兼顾进光量与星点锐利度，过小光圈会引入衍射、星点变软。";
  if(cat==="风景"||cat==="建筑") return "F"+ap+" 在保证前后景清晰的同时避开衍射极限，锐度最佳。";
  if(cat==="产品"||cat==="微距") return "F"+ap+" 提供足够景深覆盖主体细节，避免边缘失焦。";
  return "F"+ap+" 是这类题材的稳妥起点，既保证主体锐度又有合适的景深。";
}
function whyShutter(ctx,t){
  if(ctx.cat==="星空") return "约 "+fmtShutter(t)+" 在避免星星拉线（500 法则内）的同时尽量多进光。";
  if(ctx.cat==="运动"||ctx.looks.includes("freeze")) return fmtShutter(t)+" 足以冻结主体动作，避免运动模糊。";
  if(ctx.looks.includes("blur")||["长曝光","瀑布"].includes(ctx.sub)) return fmtShutter(t)+" 用于表现动态拖影 / 丝绢流水，必须配合三脚架。";
  if(ctx.cat==="人像"||ctx.cat==="婚礼"||ctx.cat==="旅行") return fmtShutter(t)+" 可有效避免人物轻微动作或手持抖动带来的模糊。";
  if(ctx.cat==="视频") return "按 180° 快门法则，快门≈2×帧率的倒数，保证自然的运动模糊。";
  return fmtShutter(t)+" 满足手持安全快门（含防抖补偿），兼顾清晰与进光。";
}
function whyIso(ctx,iso){
  if(ctx.looks.includes("lownoise")||ctx.looks.includes("maxq")) return "ISO "+iso+" 处于较低区间，噪点与动态范围表现良好。";
  if(iso>1600) return "暗光环境下的可接受起点，成片后可用降噪处理；优先保证曝光与快门。";
  return "ISO "+iso+" 是画质与曝光的平衡点，噪点控制良好。";
}
function condText(env, tmpl){
  if(!env||Object.keys(env).length===0) return "未指定条件";
  const parts=[];
  if(tmpl) for(const q of tmpl.q){ const v=env[q.k]; if(v){ const op=q.o.find(o=>o[0]===v); if(op) parts.push(op[1]); } }
  return parts.join(" / ")||"未指定条件";
}

function isStepDone(i){
  if(i===0) return !!Store.sim.camera;
  if(i===1) return Store.sim.lens!==null && Store.sim.lens!==undefined || !!fixedCam();
  if(i===2) return !!Store.sim.sub;
  if(i===3){ const t=envTmpl(); return t.q.every(q=>Store.sim.env[q.k]); }
  if(i===4) return Store.sim.look.length>0;
  return false;
}
function fixedCam(){ const c=CAMERAS.find(x=>x.id===Store.sim.camera); return c&&c.fixed?c:null; }
function envTmpl(){ const cat=catOfSub(Store.sim.sub); return ENV_T[envTypeOf(cat,Store.sim.sub)]; }

function renderSimSide(){
  const steps=STEP_LABEL.map((l,i)=>{
    const done=isStepDone(i), cur=i===SIM.step;
    return `<div class="sim-step ${done?"done":""} ${cur?"current":""}" data-step="${i}">
      <span class="dot"></span><span class="st">${l}</span><span class="ck">${I.check}</span></div>`;
  }).join("");
  $("#simSide").innerHTML=steps;
  $("#simSide").addEventListener("click",e=>{ const s=e.target.closest(".sim-step"); if(s){ const i=+s.dataset.step; if(i<SIM.step || isStepDone(i)){ SIM.step=i; renderSimStep(); } } });
}
function renderSimStep(){
  const s=SIM.step;
  if(s===0) stepCamera();
  else if(s===1) stepLens();
  else if(s===2) stepScene();
  else if(s===3) stepEnv();
  else if(s===4) stepLook();
  else stepResult();
}

      <div class="ld"><span>闪光模式</span><b>${f.mode}</b></div>
      <div class="ld"><span>功率</span><b>${f.power?"Power "+fracLabel(f.power):"—"}</b></div>
      <div class="ld"><span>高速同步 HSS</span><b>${f.hss}</b></div>

    </div>

}

/* =========================================================
   设备库
   ========================================================= */
let LIB={type:"cameras",q:"",brand:""};
function renderLib(type){
  LIB.type=type;
  let items, brandKey;
  if(type==="cameras"){ items=CAMERAS; brandKey=c=>c.brand; }
  else if(type==="lenses"){ items=LENSES; brandKey=l=>l.brand; }
  else { items=FLASHES.filter(f=>f.id!=="none"); brandKey=f=>f.brand; }
  const brands=["全部",...new Set(items.map(brandKey))];
  const q=LIB.q.toLowerCase();
  let list=items.filter(it=> q? (it.brand+" "+it.model+" "+(it.id||"")).toLowerCase().includes(q):true);
  if(LIB.brand) list=list.filter(it=>brandKey(it)===LIB.brand);
  const cardFn = type==="cameras"? libCamCard : type==="lenses"? libLensCard : libFlashCard;
  $("#app").innerHTML=`
    <div class="wrap section-tight">
      <div class="sim-head"><h2>${type==="cameras"?"相机库":type==="lenses"?"镜头库":"闪光灯库"}</h2><p>规格来自公开资料；无法确认的字段标为未知。</p></div>
      <div class="lib-toolbar">
        <div class="search" style="max-width:320px;flex:1;margin:0">${I.search}<input id="libSearch" value="${esc(LIB.q)}" placeholder="搜索型号" aria-label="搜索"/></div>
        <div class="lib-filter">${brands.map(b=>`<button class="${(LIB.brand===b)||(b==="全部"&&!LIB.brand)?"active":""}" data-b="${b}">${b}</button>`).join("")}</div>
      </div>
      ${list.length?`<div class="lib-grid">${list.map(cardFn).join("")}</div>`
      :`<div class="empty-state"><h3>${type==="cameras"?"暂未收录这台相机":"没有匹配结果"}</h3><p>${type==="cameras"?"你可以提交型号，我们会尽快补充。":"换个关键词试试。"}</p></div>`}
    </div>`;
  const inp=$("#libSearch"); let t; inp.addEventListener("input",()=>{ clearTimeout(t); t=setTimeout(()=>{LIB.q=inp.value; renderLib(type);},220); });
  $$("#app .lib-filter button").forEach(b=>b.addEventListener("click",()=>{ LIB.brand=b.dataset.b==="全部"?"":b.dataset.b; renderLib(type); }));
}
function libCamCard(c){
  return `<div class="card device-card" data-id="${c.id}"><div class="brand">${c.brand}</div><h4>${c.model}</h4>
    <div class="spec-row"><span>传感器</span><b>${SENSORS[c.ss].name} ${c.mp}MP</b></div>
    <div class="spec-row"><span>防抖 IBIS</span><b>${c.ibis} 档</b></div>
    <div class="spec-row"><span>闪光同步</span><b>${typeof c.sync==="string"?c.sync:"1/"+Math.round(1/c.sync)}</b></div>
    <div class="spec-row"><span>视频</span><b>${c.video||"—"}</b></div>
    <div class="spec-row"><span>ISO 原生</span><b>${c.iso[0]}–${c.iso[1]}</b></div>
    ${c.fixed?`<div class="spec-row"><span>内置镜头</span><b>${c.fixed}</b></div>`:""}
  </div>`;
}
function libLensCard(l){
  return `<div class="card device-card"><div class="brand">${l.brand} · ${l.mount}</div><h4>${l.model}</h4>
    <div class="spec-row"><span>焦距</span><b>${Array.isArray(l.fl)?l.fl[0]+"–"+l.fl[1]+"mm":l.fl+"mm"}</b></div>
    <div class="spec-row"><span>最大光圈</span><b>F${l.ap}</b></div>
    <div class="spec-row"><span>防抖</span><b>${l.stab?"有":"无"}</b></div>
    <div class="spec-row"><span>最近对焦</span><b>${l.mfd}m</b></div>
    ${l.macro?`<div class="spec-row"><span>微距</span><b>${l.macro===1?"1:1":l.macro>1?l.macro+":1":"1:2"}</b></div>`:""}
  </div>`;
}
function libFlashCard(f){
  return `<div class="card device-card"><div class="brand">${f.brand}</div><h4>${f.model}</h4>
    <div class="spec-row"><span>GN 指数</span><b>${f.gn||"—"}</b></div>
    <div class="spec-row"><span>TTL</span><b>${f.ttl?"支持":"—"}</b></div>
    <div class="spec-row"><span>高速同步</span><b>${f.hss?"支持":"—"}</b></div>
    <div class="spec-row"><span>功率档位</span><b>${f.power||"—"}</b></div>
    <div class="spec-row"><span>无线</span><b>${f.wireless?"支持":"—"}</b></div>
  </div>`;
}

function renderPresets(){
  const list=Store.presets;
  $("#app").innerHTML=`
    <div class="wrap section-tight">
      <div class="sim-head"><h2>我的方案</h2><p>${list.length? list.length+" 套已保存方案 · 保存在本机浏览器":"还没有保存的方案，去生成一套吧。"}</p></div>
      ${list.length?`<div class="preset-grid">
        ${list.map(p=>`<div class="card preset-card" data-id="${p.id}">
          <button class="heart ${isFav(p.id)?"fav":""}" data-fav="${p.id}" aria-label="收藏">${isFav(p.id)?I.heartFill:I.heart}</button>
          <h4>${esc(p.cam||"未选")} · ${esc(p.sub)}</h4>
          <div class="pm">${esc(p.lens||"")} · ${esc(p.conditions||"")}</div>
          <div class="pp">${esc(p.name||"方案")} · F${p.aperture} ${fmtShutter(p.shutter)} ISO ${p.iso}</div>
          <div class="preset-actions">
            <button class="copy-btn ghost" data-open="${p.id}" style="padding:8px 14px">打开</button>
            <button class="copy-btn ghost" data-copy="${p.id}" style="padding:8px 14px">${I.copy} 复制</button>
            <button class="copy-btn ghost" data-del="${p.id}" style="padding:8px 14px;color:var(--danger)">删除</button>
          </div>
        </div>`).join("")}
      </div>`:`<div class="empty-state" style="padding:60px 0"><button class="btn" id="goSim">开始模拟</button></div>`}
    </div>`;
  const gs=$("#goSim"); if(gs) gs.onclick=()=>navigate("simulator");
  $$("#app .heart").forEach(h=>h.addEventListener("click",()=>{ toggleFav(h.dataset.fav); renderPresets(); }));
  $$("#app [data-open]").forEach(b=>b.addEventListener("click",()=>{ const p=Store.presets.find(x=>x.id===b.dataset.open); if(p){ Store.lastBuilt=null; navigate("preset",p.id); } }));
  $$("#app [data-copy]").forEach(b=>b.addEventListener("click",()=>{ const p=Store.presets.find(x=>x.id===b.dataset.copy); if(p) copyText(planCopyCompact(p),b); }));
  $$("#app [data-del]").forEach(b=>b.addEventListener("click",()=>{ delPreset(b.dataset.del); renderPresets(); toast("已删除"); }));
}
function renderPresetView(id){
  const p=Store.presets.find(x=>x.id===id);
  if(!p){ $("#app").innerHTML=`<div class="wrap empty-state"><h3>找不到该方案</h3><p>可能已被删除，或链接不在当前浏览器。</p></div>`; return; }
  $("#app").innerHTML=`
    <div class="wrap section-tight" style="max-width:720px;margin:0 auto">
      <div class="sim-head"><h2>${esc(p.name||"方案")} · ${esc(p.sub)}</h2><p>${esc(p.cam||"")} · ${esc(p.lens||"")} · ${esc(p.conditions||"")}</p></div>
      <div class="main-params">
        <div class="param-big"><div class="val">${fmtAperture(p.aperture)}</div><div class="lbl">光圈</div></div>
        <div class="param-big"><div class="val">${fmtShutter(p.shutter)}</div><div class="lbl">快门</div></div>
        <div class="param-big"><div class="val">ISO ${fmtIso(p.iso)}</div><div class="lbl">感光度</div></div>
      </div>
      <div class="param-grid">
        ${paramCell("白平衡", p.wb+"K · "+p.wbLabel,"","")}
        ${paramCell("对焦", p.focus,"","")}
        ${paramCell("测光", p.meter,"","")}
        ${paramCell("文件格式", p.file,"","")}
        ${paramCell("闪光灯", p.flash?("Power "+fracLabel(p.flash.power||0.5)):"OFF","","")}
        ${paramCell("三脚架", p.tripod?"建议使用":"可选","","")}
      </div>
      <div class="air-copy" style="justify-content:flex-start">
        <button class="copy-btn" id="pvFull">${I.copy} 复制参数</button>
        <button class="copy-btn ghost" id="pvCompact">精简版</button>
        <button class="copy-btn ghost" id="pvMd">Markdown</button>
        <button class="copy-btn ghost" id="pvSave" ${isFav(p.id)?"style='color:var(--danger)'":""}>${isFav(p.id)?I.heartFill:I.heart} ${isFav(p.id)?"已收藏":"收藏"}</button>
      </div>
      <p class="disclaimer">该方案保存在本机浏览器。摄影参数会受到现场光线、主体反射率等因素影响，以上为可执行的起始方案。</p>
    </div>`;
  $("#pvFull").onclick=()=>copyText(planCopyFull(p),$("#pvFull"));
  $("#pvCompact").onclick=()=>copyText(planCopyCompact(p),$("#pvCompact"));
  $("#pvMd").onclick=()=>copyText(planCopyMd(p),$("#pvMd"));
  $("#pvSave").onclick=()=>{ toggleFav(p.id); renderPresetView(id); };
}

/* =========================================================
   初始化
   ========================================================= */
function initReveal(){
  if(!("IntersectionObserver" in window)){ $$(".reveal,[data-r]").forEach(e=>e.classList.add("in")); return; }
  const io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } }),{threshold:.12});
  $$(".reveal,[data-r]").forEach(e=>{ e.classList.add("reveal"); io.observe(e); });
}
function highlightNav(v){
  $$("#navLinks button").forEach(b=>b.classList.toggle("active", b.dataset.nav===v || (["result","simulator"].includes(v)&&b.dataset.nav==="simulator")));
}
function renderRoute(){
  const v=ROUTE.view;
  if(v==="preset"&&ROUTE.param){ renderPresetView(ROUTE.param); }
  else if(v==="result"){ renderResultView(); }
  else if(v==="cameras"){ renderLib("cameras"); }
  else if(v==="lenses"){ renderLib("lenses"); }
  else if(v==="flashes"){ renderLib("flashes"); }
  else if(v==="presets"){ renderPresets(); }
  else if(v==="about"){ renderAbout(); }
  else if(v==="simulator"){ renderSimulator(); }
  else { renderHome(); }
  highlightNav(v);
  window.scrollTo({top:0,behavior:"instant"});
}
function init(){
  setTheme(Store.theme);
  parseHash();
  $$("#navLinks button").forEach(b=>b.addEventListener("click",()=>{ navigate(b.dataset.nav); closeMenu(); }));
  document.querySelectorAll(".nav-brand,.nav-cta").forEach(el=>el.addEventListener("click",()=>{ if(el.classList.contains("nav-brand")) navigate("home"); else navigate("simulator"); closeMenu(); }));
  $("#themeBtn").addEventListener("click",()=>setTheme(Store.theme==="light"?"dark":"light"));
  $("#burgerBtn").addEventListener("click",openMenu);
  $("#closeMenu").addEventListener("click",closeMenu);
  buildMenuLinks();
  renderRoute();
}
function buildMenuLinks(){
  const links=[["模拟器","simulator"],["相机","cameras"],["镜头","lenses"],["闪光灯","flashes"],["我的方案","presets"],["关于","about"]];
  $("#mobileMenuLinks").innerHTML=links.map(([t,v])=>`<button class="sim-step" data-mv="${v}" style="width:100%;padding:14px;font-size:17px;color:var(--fg)"><span class="st">${t}</span></button>`).join("");
  $$("#mobileMenuLinks button").forEach(b=>b.addEventListener("click",()=>{ navigate(b.dataset.mv); closeMenu(); }));
}
function openMenu(){ $("#mobileMenu").style.display="block"; }
function closeMenu(){ $("#mobileMenu").style.display="none"; }
init();
</script>
