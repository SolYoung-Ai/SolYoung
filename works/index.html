<style>
:root{
  --bg:#F7F7F5;--bg-soft:#F0F0ED;--ink:#1B1B19;--ink-soft:#6D6D67;--ink-faint:#9C9C95;
  --line:rgba(27,27,25,.14);--accent:#E87028;--card:#FCFCFB;
  --ease:cubic-bezier(.22,1,.36,1);
  --font-display:'Archivo','Noto Sans SC',system-ui,sans-serif;
  --font-serif:'Noto Serif SC',Georgia,serif;
  --font-body:'Noto Sans SC','PingFang SC',system-ui,sans-serif;
  --frame:#FFFFFF;--bar:#F1F1EF;
  --shadow:0 2px 4px rgba(27,27,25,.04),0 34px 70px -40px rgba(27,27,25,.28);
}
html[data-theme="dark"]{
  --bg:#121212;--bg-soft:#1C1C1C;--ink:#EDEDED;--ink-soft:#9F9F9F;--ink-faint:#6A6A6A;
  --line:rgba(237,237,237,.14);--card:#1A1A1A;--frame:#232323;--bar:#2B2B2B;
  --shadow:0 2px 4px rgba(0,0,0,.3),0 34px 70px -40px rgba(0,0,0,.72);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.container{max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:62px;gap:20px}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand .dot{color:var(--accent)}
.nav-links{display:flex;gap:clamp(14px,2.4vw,30px);font-size:12.5px;color:var(--ink-soft)}
.nav-links a{transition:color .25s;white-space:nowrap}
.nav-links a:hover,.nav-links a.on{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:8px}
.tbtn{width:32px;height:32px;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:50%;font-family:var(--font-display);font-size:11px;letter-spacing:.04em;color:var(--ink-soft);transition:all .25s}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn svg{width:15px;height:15px}

/* ---------- head ---------- */
.pj-head{padding:clamp(56px,8vw,104px) 0 clamp(30px,4vw,52px)}
.pj-kicker{font-family:var(--font-display);font-size:10.5px;letter-spacing:.28em;color:var(--accent);text-transform:uppercase;display:flex;align-items:center;gap:12px}
.pj-kicker::before{content:"";width:28px;height:1px;background:var(--accent)}
.pj-title-row{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.pj-title{font-family:var(--font-display);font-weight:800;font-size:clamp(56px,9.4vw,118px);line-height:1;letter-spacing:-.055em;margin:18px 0 0}
.pj-title em{font-family:var(--font-serif);font-style:normal;font-weight:600;font-size:.5em;letter-spacing:-.02em;margin-left:.26em;vertical-align:.14em}
.pj-ghost{font-family:var(--font-display);font-weight:800;font-size:clamp(72px,12vw,158px);line-height:.76;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1px var(--line);user-select:none;pointer-events:none}
.pj-sub{color:var(--ink-soft);font-size:14.5px;line-height:1.9;max-width:600px;margin:22px 0 0}

/* ---------- carousel ---------- */
html,body{overscroll-behavior-x:none}
.pj-viewport::-webkit-scrollbar{display:none}
.pj-stage{margin-bottom:clamp(50px,7vw,86px)}
.pj-viewport{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-behavior:auto;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;cursor:grab;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.pj-viewport.dragging{cursor:grabbing}
.pj-track{display:flex;gap:24px}
.pj-slide{flex:0 0 100%;min-width:0}
.pj-card{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-height:clamp(430px,42vw,530px)}
.pj-shot{position:relative;overflow:hidden;background:var(--bg-soft)}
.pj-shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.pj-info{padding:clamp(28px,3.2vw,52px);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.pj-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pj-no{font:700 12px/1 var(--font-display);color:var(--accent);letter-spacing:.1em}
.pj-kind{font:600 10px/1 var(--font-display);letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase}
.pj-name{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,4.3vw,56px);letter-spacing:-.04em;margin:26px 0 0;line-height:1.04;overflow-wrap:anywhere}
.pj-subname{font:500 11px/1 var(--font-display);letter-spacing:.22em;color:var(--ink-faint);margin-top:12px;text-transform:uppercase}
.pj-rule{height:1px;background:var(--line);margin:26px 0}
.pj-desc{font-size:14px;line-height:1.95;color:var(--ink-soft);margin:0;max-width:40ch}
.pj-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.pj-tag{font:500 10.5px/1 var(--font-body);color:var(--ink-soft);border:1px solid var(--line);border-radius:20px;padding:7px 12px;white-space:nowrap}
.pj-foot{margin-top:auto;padding-top:30px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pj-go{display:inline-flex;align-items:center;gap:12px;background:var(--accent);color:#fff;border-radius:30px;padding:13px 22px;font:600 12px/1 var(--font-display);letter-spacing:.08em;transition:filter .25s,gap .25s,transform .25s}
.pj-go:hover{filter:brightness(1.08);gap:18px;transform:translateY(-2px)}
.pj-go b{font-size:14px;font-weight:500}
.pj-domain{font:500 10.5px/1 var(--font-display);color:var(--ink-faint);letter-spacing:.03em}

/* ---------- controls ---------- */
.pj-controls{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:30px}
.pj-hint{display:flex;align-items:center;gap:9px;font:500 11px/1 var(--font-display);letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}
.pj-hint svg{width:22px;height:12px;opacity:.7}
.pj-tabs{display:flex;gap:8px;flex-wrap:wrap}
.pj-tab{background:none;border:1px solid var(--line);border-radius:30px;padding:9px 16px;font:600 11px/1 var(--font-display);letter-spacing:.05em;color:var(--ink-soft);display:inline-flex;align-items:center;gap:9px;transition:all .25s}
.pj-tab b{color:var(--ink-faint);font-size:10px;transition:color .25s}
.pj-tab:hover{border-color:var(--accent);color:var(--accent)}
.pj-tab.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.pj-tab.on b{color:var(--accent)}
.pj-nav{display:flex;align-items:center;gap:10px}
.pj-count{font:600 11px/1 var(--font-display);letter-spacing:.1em;color:var(--ink-faint);margin-right:8px;white-space:nowrap}
.pj-count b{color:var(--ink);font-weight:700}
.pj-arrow{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-family:var(--font-display);font-size:17px;line-height:1;color:var(--ink-soft);transition:all .25s}
.pj-arrow:hover:not(:disabled){border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.pj-arrow:disabled{opacity:.32;cursor:default}
.pj-progress{height:2px;background:var(--line);margin-top:26px;border-radius:2px;overflow:hidden}
.pj-progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .35s var(--ease)}

/* ---------- cta + footer ---------- */
.pj-cta{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);padding:28px 0 0;margin-bottom:64px}
.pj-cta p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.8}
.pj-cta a{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:30px;padding:11px 20px;font-family:var(--font-display);font-size:11.5px;letter-spacing:.1em;transition:all .28s}
.pj-cta a:hover{border-color:var(--accent);color:var(--accent);gap:16px}
.ft{border-top:1px solid var(--line);padding:34px 0 46px;text-align:center;font-size:11.5px;color:var(--ink-faint);letter-spacing:.06em}

/* ---------- entrance ---------- */
.rv{opacity:0;transform:translateY(20px);animation:rvIn .85s var(--ease) forwards}
@keyframes rvIn{to{opacity:1;transform:none}}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}

/* ---------- responsive ---------- */
@media(max-width:960px){
  .nav-links{display:none}
  .pj-slide{flex:0 0 100%}
  .pj-card{grid-template-columns:1fr;min-height:0}
  .pj-shot{aspect-ratio:16/10}
  .pj-info{border-left:0;border-top:1px solid var(--line);padding:clamp(24px,4vw,36px)}
  .pj-name{margin-top:20px}
  .pj-rule{margin:20px 0}
  .pj-foot{padding-top:24px}
}
@media(max-width:620px){
  .container{padding:0 16px}
  .pj-title em{font-size:.4em}
  .pj-ghost{display:none}
  .pj-slide{flex:0 0 100%}
  .pj-track{gap:12px}
  .pj-name{font-size:clamp(30px,9vw,42px)}
  .pj-controls{gap:14px}
  .pj-hint{order:3;width:100%;justify-content:center}
  .pj-tabs{order:1}
  .pj-nav{order:2;margin-left:auto}
  .pj-tab{padding:8px 12px;font-size:10px}
  .pj-arrow{width:38px;height:38px}
  .pj-count{margin-right:4px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<nav class="nav">

<main class="container">
  <header class="pj-head">
    <div class="pj-kicker rv" data-i18n="kicker">SELECTED WORK · 02 PROJECTS</div>
    <div class="pj-title-row">
      <h1 class="pj-title rv d1"><span data-i18n="t1">项目</span><em class="accent" data-i18n="t2">Projects</em></h1>
      <div class="pj-ghost rv d2" aria-hidden="true">02</div>

  <section class="pj-stage" aria-label="项目轮播">

<footer class="ft"><div class="container">© 2026 SolYoung · <span data-i18n="foot">把人生，当成一场游戏来经营。</span></div></footer>

<script>
(function(){
  'use strict';
  var root=document.documentElement;
  var lang=localStorage.getItem('soyoung-lang')==='en'?'en':'zh';
  var theme=localStorage.getItem('soyoung-theme');
  if(!theme) theme=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  root.setAttribute('data-theme',theme);

  var PROJECTS=[
    {id:'solhub',domain:'solhub.solyoung.top',url:'https://solhub.solyoung.top/',img:'../assets/project-solhub.jpg',
     zh:{name:'SolHub',sub:'DIGITAL TOOL HUB',kind:'数字产品 · DIGITAL PRODUCT',
         desc:'收录自研的数字产品与免费在线工具，也欢迎其他独立开发者提交自己的产品。一个用来发现、展示与分享作品的地方。',
         tags:['工具社区','免费工具','独立开发']},
     en:{name:'SolHub',sub:'DIGITAL TOOL HUB',kind:'DIGITAL PRODUCT',
         desc:'A home for my own digital products and free online tools — and an open door for other indie makers to submit theirs. Discover, showcase, share.',
         tags:['Tool Hub','Free Tools','Indie']}},
    {id:'studio',domain:'studio.solyoung.top',url:'https://studio.solyoung.top/',img:'../assets/project-studio.jpg',
     zh:{name:'SolYoung Studio',sub:'DIGITAL SERVICE STUDIO',kind:'数字产品 · DIGITAL PRODUCT',
         desc:'把你的主意，变成可以使用的解决方案。个人网站、数字空间、品牌合作与 AI 工作流，从想法到上线，我自己做完。',
         tags:['定制开发','网站设计','AI 工作流']},
     en:{name:'SolYoung Studio',sub:'DIGITAL SERVICE STUDIO',kind:'DIGITAL PRODUCT',
         desc:'Turning your idea into a usable solution. Personal sites, digital spaces, brand collaborations and AI workflows — from first thought to launch, built end to end.',
         tags:['Custom Build','Web Design','AI Workflow']}}
  ];

  var I18N={
    'nav-projects':{zh:'项目',en:'Projects'},'nav-now':{zh:'构建',en:'Build'},'nav-thoughts':{zh:'博客',en:'Blog'},
    'nav-about':{zh:'关于我',en:'About'},'nav-contact':{zh:'联系',en:'Contact'},
    kicker:{zh:'SELECTED WORK · 02 PROJECTS',en:'SELECTED WORK · 02 PROJECTS'},
    t1:{zh:'项目',en:'Projects'},t2:{zh:'Projects',en:'/ 02'},
    sub:{zh:'两个正在运行的数字产品。左右滑动，看看它们长什么样。',en:'Two digital products, live and growing. Swipe to take a closer look.'},
    visit:{zh:'访问网站',en:'VISIT SITE'},hint:{zh:'左右拖动 · 双指滑动',en:'DRAG · TWO-FINGER SWIPE'},
    'cta-text':{zh:'这两个都在持续更新。想看我最近在做什么，回主页继续逛。',en:'Both are still growing. Head back home to see what I am building right now.'},
    'cta-go':{zh:'回到主页 ↗',en:'Back home ↗'},
    foot:{zh:'把人生，当成一场游戏来经营。',en:'Playing life as a management game.'}
  };
  function t(k){return (I18N[k]||{})[lang]||k;}
  function pad(n){return String(n).padStart(2,'0');}
  function applyStatic(){
    document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');if(I18N[k])el.innerHTML=I18N[k][lang];});
    document.getElementById('langTxt').textContent=lang==='zh'?'EN':'中';
    root.setAttribute('lang',lang==='zh'?'zh-CN':'en');
  }

  var viewport=document.getElementById('viewport'),track=document.getElementById('track'),
      tabs=document.getElementById('tabs'),cur=document.getElementById('cur'),
      prog=document.getElementById('prog'),prev=document.getElementById('prev'),next=document.getElementById('next'),
      idx=0,step=0,maxShift=0;
  document.getElementById('total').textContent=pad(PROJECTS.length);

  function slideHTML(p,i){
    var d=p[lang],no=pad(i+1);
    var tags=d.tags.map(function(x){return '<span class="pj-tag">'+x+'</span>';}).join('');
    return '<article class="pj-slide" data-idx="'+i+'">'+
      '<div class="pj-card">'+
        '<div class="pj-shot"><img loading="'+(i===0?'eager':'lazy')+'" draggable="false" src="'+p.img+'" alt="'+d.name+' — '+p.domain+'"></div>'+
        '<div class="pj-info">'+
          '<div class="pj-meta"><span class="pj-no">'+no+'</span><span class="pj-kind">'+d.kind+'</span></div>'+
          '<h2 class="pj-name">'+d.name+'</h2>'+
          '<div class="pj-subname">'+d.sub+'</div>'+
          '<div class="pj-rule"></div>'+
          '<p class="pj-desc">'+d.desc+'</p>'+
          '<div class="pj-tags">'+tags+'</div>'+
          '<div class="pj-foot">'+
            '<a class="pj-go" href="'+p.url+'" target="_blank" rel="noopener noreferrer">'+t('visit')+' <b>↗</b></a>'+
            '<span class="pj-domain">'+p.domain+'</span>'+
          '</div>'+
        '</div>'+
      '</div></article>';
  }
  function render(){
    track.innerHTML=PROJECTS.map(slideHTML).join('');
    tabs.innerHTML=PROJECTS.map(function(p,i){
      return '<button class="pj-tab" data-go="'+i+'"><b>'+pad(i+1)+'</b>'+p[lang].name+'</button>';
    }).join('');
  }
  function measure(){
    var slides=track.querySelectorAll('.pj-slide');
    if(slides.length<2){step=viewport.clientWidth;maxShift=0;return;}
    step=slides[1].offsetLeft-slides[0].offsetLeft;
    maxShift=Math.max(0,viewport.scrollWidth-viewport.clientWidth);
  }
  function base(n){return Math.min(n*step,maxShift);}
  function clampIdx(n){return Math.max(0,Math.min(PROJECTS.length-1,n));}
  function updateControls(){
    cur.textContent=pad(idx+1);
    prog.style.width=((idx+1)/PROJECTS.length*100)+'%';
    prev.disabled=(idx<=0);next.disabled=(idx>=PROJECTS.length-1);
    Array.prototype.forEach.call(tabs.children,function(b,i){b.classList.toggle('on',i===idx);});
  }
  function apply(smooth){
    viewport.classList.remove('dragging');
    if(smooth) viewport.scrollTo({left:base(idx),behavior:'smooth'});
    else viewport.scrollLeft=base(idx);
    updateControls();
  }
  function go(n){idx=clampIdx(n);apply(true);}

  /* 鼠标 / 触控笔拖拽；触屏与触控板交给浏览器原生横向滚动（跟手、带惯性） */
  var drag=null,moved=false;
  viewport.addEventListener('pointerdown',function(e){
    if(e.pointerType==='touch') return;
    if(e.target.closest('a')||e.target.closest('button')) return;
    drag={x:e.clientX,start:viewport.scrollLeft,dx:0};moved=false;
    try{viewport.setPointerCapture(e.pointerId);}catch(err){}
    viewport.classList.add('dragging');
  });
  viewport.addEventListener('pointermove',function(e){
    if(!drag) return;
    drag.dx=e.clientX-drag.x;
    if(Math.abs(drag.dx)>8) moved=true;
    viewport.scrollLeft=Math.min(Math.max(drag.start-drag.dx,0),maxShift);
  });
  function endDrag(){
    if(!drag) return;
    var dx=drag.dx,threshold=Math.min(90,viewport.clientWidth*.12);
    drag=null;
    idx=clampIdx(idx+(dx<-threshold?1:dx>threshold?-1:0));
    apply(true);
  }
  viewport.addEventListener('pointerup',endDrag);
  viewport.addEventListener('pointercancel',endDrag);
  viewport.addEventListener('click',function(e){if(moved){e.preventDefault();e.stopPropagation();moved=false;}},true);
  viewport.addEventListener('dragstart',function(e){e.preventDefault();});

  /* 滚动停止后吸附到整卡（触屏 / 拖拽路径）。滚动全程不拦截，原生手感 */
  var settle=null,settling=false,wheelActive=false,wAcc=0,wDir=0,wIdle=null;
  viewport.addEventListener('scroll',function(){
    if(settling||wheelActive) return;
    clearTimeout(settle);
    settle=setTimeout(function(){
      if(drag||wheelActive) return;
      idx=clampIdx(Math.round(viewport.scrollLeft/(step||1)));
      updateControls();
      var target=base(idx);
      if(Math.abs(viewport.scrollLeft-target)>2){
        settling=true;
        viewport.scrollTo({left:target,behavior:'smooth'});
        setTimeout(function(){settling=false;},420);
      }
    },150);
  },{passive:true});

  /* 触控板双指横划：滚动全程交给浏览器原生处理（跟手、带惯性）；
     手势结束按累计位移判断翻页意图 —— 轻划即切一张，轻微抖动则吸回原卡。
     越界方向一律拦截，避免 Chrome 把它变成「侧滑返回/前进」导航。 */
  viewport.addEventListener('wheel',function(e){
    var dx=e.deltaX,dy=e.deltaY;
    if(e.shiftKey&&Math.abs(dy)>Math.abs(dx)){dx=dy;dy=0;}
    if(Math.abs(dx)<1.5||Math.abs(dx)<=Math.abs(dy)*1.1) return;
    var atStart=viewport.scrollLeft<=1,atEnd=viewport.scrollLeft>=maxShift-1;
    if((dx<0&&atStart)||(dx>0&&atEnd)){
      if(e.cancelable) e.preventDefault();
      return;
    }
    wheelActive=true;
    wAcc+=dx;wDir=dx>0?1:-1;
    clearTimeout(wIdle);
    wIdle=setTimeout(function(){
      var travel=Math.abs(wAcc);wAcc=0;wheelActive=false;
      var here=clampIdx(Math.round(viewport.scrollLeft/(step||1)));
      idx=travel>=45?clampIdx(idx+wDir):here;
      settling=true;
      apply(true);
      setTimeout(function(){settling=false;},480);
    },170);
  },{passive:false});

  /* 页面级兜底：除真正可横向滚动的容器外，一律吃掉横向 wheel，
     彻底关闭 macOS Chrome 的「双指侧滑跳转上一页/下一页」手势 */
  document.addEventListener('wheel',function(e){
    var dx=e.deltaX,dy=e.deltaY;
    if(Math.abs(dx)<1.5||Math.abs(dx)<=Math.abs(dy)*1.1) return;
    var el=e.target;
    if(el&&el.closest&&el.closest('.hp-viewport,.pj-viewport,.vid-scroll,.notes')) return;
    if(e.cancelable) e.preventDefault();
  },{capture:true,passive:false});

  prev.addEventListener('click',function(){go(idx-1);});
  next.addEventListener('click',function(){go(idx+1);});
  tabs.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b)go(Number(b.getAttribute('data-go')));});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){go(idx-1);}
    if(e.key==='ArrowRight'){go(idx+1);}
  });

  /* ---------- theme / lang ---------- */
  var themeBtn=document.getElementById('themeBtn'),iconSun=document.getElementById('iconSun'),iconMoon=document.getElementById('iconMoon');
  function syncTheme(){
    var dark=root.getAttribute('data-theme')==='dark';
    iconSun.style.display=dark?'block':'none';iconMoon.style.display=dark?'none':'block';
  }
  themeBtn.addEventListener('click',function(){
    var n=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',n);localStorage.setItem('soyoung-theme',n);syncTheme();
  });
  document.getElementById('langBtn').addEventListener('click',function(){
    lang=lang==='zh'?'en':'zh';
    localStorage.setItem('soyoung-lang',lang);
    applyStatic();render();
    requestAnimationFrame(function(){measure();apply();});
  });

  var rt;
  window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){measure();apply();},120);});
  window.addEventListener('load',function(){measure();apply();});

  applyStatic();render();syncTheme();
  requestAnimationFrame(function(){measure();apply();});
})();
</script>
</body>
</html>
