<style>
  :root{--accent:#E87028;--ink:#1B1B19;--ink-soft:#6D6D67;--bg:#F7F7F5}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;padding:24px;display:grid;place-items:center;text-align:center;color:var(--ink);
    background:radial-gradient(120% 90% at 50% 0%,#FFFFFF 0%,var(--bg) 58%);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;

  .k{font-size:10px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
  h1{font-size:clamp(25px,6vw,36px);font-weight:700;letter-spacing:-.02em;margin:14px 0 10px}
  p{font-size:13.5px;line-height:1.85;color:var(--ink-soft);margin:0 0 24px}
  a{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;
    background:var(--accent);color:#fff;text-decoration:none;font-size:13px;font-weight:600;
    box-shadow:0 16px 34px -18px rgba(232,112,40,.95);
    transition:transform .45s cubic-bezier(.34,1.36,.5,1),box-shadow .3s}
  a:hover{transform:translateY(-2px);box-shadow:0 22px 40px -18px rgba(232,112,40,.95)}
