<style>
:root{
  --bg:#F4F0E7;--bg-soft:#EFEADF;--ink:#1D1A15;--ink-soft:#6B6455;--ink-faint:#9A927F;
  --line:rgba(29,26,21,.14);--accent:#E87028;--card:#FAF7F0;
  --ease:cubic-bezier(.22,1,.36,1);
  --font-display:'Archivo','Noto Sans SC',system-ui,sans-serif;
  --font-serif:'Noto Serif SC',Georgia,serif;
  --font-body:'Noto Sans SC','PingFang SC',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.container{max-width:920px;margin:0 auto;padding:0 24px}
.hd{position:sticky;top:0;z-index:50;background:rgba(244,240,231,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd-in{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand .dot{color:var(--accent)}
.back{font-family:var(--font-display);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);transition:color .3s}
.back:hover{color:var(--accent)}
.hero{padding:88px 0 0}
h1{font-family:var(--font-serif);font-weight:900;font-size:clamp(46px,9vw,82px);margin:14px 0 18px;letter-spacing:-.02em;line-height:.95}
h1 .accent{color:var(--accent)}
.sub{color:var(--ink-soft);font-size:15px;line-height:1.9;max-width:640px;margin:0}
.group{margin-top:54px;padding-bottom:88px}
.gtitle{font-family:var(--font-display);font-size:11px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:20px}
.projects{border-top:1px solid var(--line)}
.project{display:flex;align-items:center;gap:clamp(16px,3vw,28px);padding:24px 4px;border-bottom:1px solid var(--line);transition:padding-left .35s var(--ease)}
.project:hover{padding-left:10px}
.p-icon{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--line)}
.p-main{flex:1;min-width:0}
.p-name{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--ink)}
.p-desc{font-size:13.5px;color:var(--ink-soft);margin-top:4px}
.p-meta{font-family:var(--font-display);font-size:11px;letter-spacing:.12em;color:var(--ink-faint)}
.p-arr{color:var(--accent);font-size:18px;transition:transform .3s}
.project:hover .p-arr{transform:translateX(4px)}
.g-tags{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 18px}
.tag{font-family:var(--font-display);font-size:10px;letter-spacing:.06em;color:var(--ink-soft);border:1px solid var(--line);border-radius:20px;padding:3px 10px;line-height:1}
.p-tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.project.project-soon{cursor:default}
.project.project-soon:hover{padding-left:4px}
.project.project-soon:hover .p-arr{transform:none}
.ft{padding:76px 0 48px;text-align:center}
.ft .muted{font-size:12px;color:var(--ink-faint)}
@media(max-width:640px){.hero{padding:56px 0 0}.p-icon{width:46px;height:46px}.p-meta{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
