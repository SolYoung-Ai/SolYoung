<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SolYoung Farm Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a2a1a;color:#fff;font-family:monospace;display:flex;flex-direction:column;align-items:center;padding:12px;min-height:100vh}
h1{font-size:14px;margin-bottom:8px;letter-spacing:2px}
#game{border:4px solid #5a3a1a;box-shadow:0 0 0 3px #8b5a2a,0 8px 20px rgba(0,0,0,.5);image-rendering:pixelated;background:#6a9e3f;cursor:pointer}
.hint{margin-top:10px;font-size:11px;opacity:.7;max-width:700px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<h1>★ SOLYOUNG FARM — PREVIEW</h1>
<canvas id="game" width="800" height="500"></canvas>
<p class="hint">点地面走路 · 这是美术预览版，交互先简化 · 满意后再整合进正式站</p>

<script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

// palette
const P={
  grass1:'#6a9e3f',grass2:'#5a8c35',grass3:'#7bb34a',
  dirt:'#8b6f47',dirtWet:'#5a452a',path:'#b8a070',
  wall:'#e8d4a8',wallD:'#c9b088',roof:'#b83a2a',roofD:'#7a2015',
  wood:'#8b5a2a',woodD:'#5a3a1a',woodL:'#b8874a',
  skin:'#f0c8a0',hair:'#5a3a20',shirt:'#8a8a8a',pants:'#2d1f0e',
};

const TILE=32;
const COLS=25,ROWS=16;

// player
const player={x:12,y:9,dir:'down',moving:false,walkFrame:0,path:[]};
let camX=0,camY=0;

// buildings
const buildings=[
  {x:4,y:3,w:4,h:3,type:'house',name:'SOLYOUNG.TOP'},
  {x:10,y:3,w:3,h:3,type:'market',name:'DIGITAL MARKET'},
  {x:15,y:3,w:4,h:3,type:'studio',name:'STUDIO'},
];

// plots (farm area)
const plots={};
for(let y=11;y<=14;y++)for(let x=8;x<=16;x++)
  plots[x+','+y]={tilled:false,crop:null,growth:0,watered:false};

function drawGrass(){
  // base
  ctx.fillStyle=P.grass1;
  ctx.fillRect(0,0,COLS*TILE,ROWS*TILE);
  // texture dots
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const h=(x*7+y*13)%5;
    if(h===0){ctx.fillStyle=P.grass2;ctx.fillRect(x*TILE+8,y*TILE+12,3,2);}
    if(h===1){ctx.fillStyle=P.grass3;ctx.fillRect(x*TILE+18,y*TILE+20,3,2);}
    if(h===2){ctx.fillStyle=P.grass2;ctx.fillRect(x*TILE+14,y*TILE+24,2,2);}
  }
}

function drawPaths(){
  // horizontal path in front of buildings
  ctx.fillStyle=P.path;
  ctx.fillRect(3*TILE,8*TILE,19*TILE,TILE);
  // vertical to farm
  ctx.fillRect(11*TILE,9*TILE,TILE,3*TILE);
}

function drawHouse(bx,by,bw,bh){
  const x=bx*TILE,y=by*TILE,w=bw*TILE,h=bh*TILE;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.fillRect(x+4,y+h-6,w,10);
  // wall
  ctx.fillStyle=P.wall;
  ctx.fillRect(x,y+h*0.35,w,h*0.65);
  // wall planks
  ctx.fillStyle=P.wallD;
  for(let i=1;i<4;i++)ctx.fillRect(x,y+h*0.35+i*h*0.65/4,w,1);
  // roof
  ctx.fillStyle=P.roof;
  ctx.beginPath();
  ctx.moveTo(x-6,y+h*0.35);
  ctx.lineTo(x+w/2,y-4);
  ctx.lineTo(x+w+6,y+h*0.35);
  ctx.fill();
  // roof tiles
  ctx.fillStyle=P.roofD;
  for(let i=0;i<4;i++){
    ctx.fillRect(x+8+i*w/4,y+h*0.2,i*w/8+4,1);
  }
  // chimney
  ctx.fillStyle=P.woodD;
  ctx.fillRect(x+w-20,y+10,10,20);
  // door
  ctx.fillStyle=P.woodD;
  ctx.fillRect(x+w/2-12,y+h-30,24,30);
  ctx.fillStyle=P.gold||'#ffd97a';
  ctx.fillRect(x+w/2+6,y+h-16,3,3);
  // steps
  ctx.fillStyle=P.path;
  ctx.fillRect(x+w/2-16,y+h,32,6);
  // windows
  ctx.fillStyle='#a8d8ea';
  ctx.fillRect(x+12,y+h*0.45,20,18);
  ctx.fillRect(x+w-32,y+h*0.45,20,18);
  ctx.strokeStyle=P.woodD;
  ctx.lineWidth=2;
  ctx.strokeRect(x+12,y+h*0.45,20,18);
  ctx.strokeRect(x+w-32,y+h*0.45,20,18);
  // embedded sign
  ctx.fillStyle=P.wood;
  ctx.fillRect(x+w/2-35,y+h*0.38,70,14);
  ctx.strokeStyle=P.woodD;
  ctx.strokeRect(x+w/2-35,y+h*0.38,70,14);
  ctx.fillStyle='#ffd97a';
  ctx.font='bold 9px Courier New';
  ctx.textAlign='center';
  ctx.fillText('SOLYOUNG.TOP',x+w/2,y+h*0.38+10);
}

function drawMarket(bx,by,bw,bh){
  const x=bx*TILE,y=by*TILE,w=bw*TILE,h=bh*TILE;
  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.fillRect(x+4,y+h-6,w,10);
  // wall
  ctx.fillStyle='#c9a06a';
  ctx.fillRect(x,y+h*0.3,w,h*0.7);
  // counter
  ctx.fillStyle=P.wood;
  ctx.fillRect(x+6,y+h*0.55,w-12,20);
  // awning
  ctx.fillStyle='#c0392b';
  ctx.fillRect(x-4,y+h*0.2,w+8,14);
  ctx.fillStyle='#fff';
  for(let i=0;i<3;i++)ctx.fillRect(x-4+i*w/3,y+h*0.2,w/6,14);
  // goods
  ctx.fillStyle='#c0392b';ctx.fillRect(x+12,y+h*0.55-8,8,8);
  ctx.fillStyle='#e87028';ctx.fillRect(x+28,y+h*0.55-8,8,8);
  ctx.fillStyle='#d6487a';ctx.fillRect(x+44,y+h*0.55-8,8,8);
  // sign
  ctx.fillStyle=P.woodD;
  ctx.fillRect(x+8,y+h-18,w-16,12);
  ctx.fillStyle='#ffd97a';
  ctx.font='bold 8px Courier New';
  ctx.textAlign='center';
  ctx.fillText('DIGITAL MARKET',x+w/2,y+h-9);
}

function drawStudio(bx,by,bw,bh){
  const x=bx*TILE,y=by*TILE,w=bw*TILE,h=bh*TILE;
  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.fillRect(x+4,y+h-6,w,10);
  // wall
  ctx.fillStyle='#d4a76a';
  ctx.fillRect(x,y+h*0.3,w,h*0.7);
  // planks
  ctx.fillStyle='#b8956a';
  for(let i=1;i<3;i++)ctx.fillRect(x,y+h*0.3+i*h*0.35,w,1);
  // roof
  ctx.fillStyle=P.woodD;
  ctx.beginPath();
  ctx.moveTo(x-6,y+h*0.3);
  ctx.lineTo(x+w/2,y);
  ctx.lineTo(x+w+6,y+h*0.3);
  ctx.fill();
  // door
  ctx.fillStyle='#2d1f0e';
  ctx.fillRect(x+w/2-14,y+h-36,28,36);
  ctx.fillStyle='#4a6b8a';
  ctx.fillRect(x+w/2-10,y+h-32,20,32);
  // window
  ctx.fillStyle='#a8d8ea';
  ctx.fillRect(x+10,y+h*0.4,18,16);
  // sign
  ctx.fillStyle=P.woodD;
  ctx.fillRect(x+w/2-30,y+h*0.32,60,14);
  ctx.fillStyle='#ffd97a';
  ctx.font='bold 10px Courier New';
  ctx.textAlign='center';
  ctx.fillText('STUDIO',x+w/2,y+h*0.32+10);
}

function drawTree(gx,gy){
  const x=gx*TILE,y=gy*TILE;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.fillRect(x+6,y+24,20,6);
  // trunk
  ctx.fillStyle=P.woodD;
  ctx.fillRect(x+14,y+16,6,14);
  // leaves
  ctx.fillStyle='#3a6b2a';
  ctx.fillRect(x+6,y+6,20,14);
  ctx.fillStyle='#4d7a30';
  ctx.fillRect(x+10,y+2,12,10);
}

function drawPlot(gx,gy,p){
  const x=gx*TILE,y=gy*TILE;
  if(p.tilled){
    ctx.fillStyle=p.watered?P.dirtWet:P.dirt;
    ctx.fillRect(x+1,y+1,TILE-2,TILE-2);
    // furrows
    ctx.fillStyle='rgba(0,0,0,.2)';
    ctx.fillRect(x+4,y+8,TILE-8,1);
    ctx.fillRect(x+4,y+16,TILE-8,1);
    ctx.fillRect(x+4,y+24,TILE-8,1);
  }
  if(p.crop){
    const stage=p.growth;
    const cx=x+TILE/2,cy=y+TILE/2;
    if(stage<2){
      ctx.fillStyle='#4d7a30';
      ctx.fillRect(cx-2,cy-2,4,4);
    }else if(stage<4){
      ctx.fillStyle='#3a6b2a';
      ctx.fillRect(cx-3,cy-4,6,8);
    }else{
      ctx.fillStyle=p.crop==='radish'?'#c0392b':p.crop==='tomato'?'#e87028':'#d6487a';
      ctx.fillRect(cx-4,cy-4,8,8);
    }
  }
}

function drawPlayer(){
  const x=player.x*TILE+TILE/2,y=player.y*TILE+TILE/2;
  const f=player.walkFrame%2;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.beginPath();ctx.ellipse(x,y+10,6,3,0,0,Math.PI*2);ctx.fill();
  // legs
  ctx.fillStyle=P.pants;
  if(f===0){
    ctx.fillRect(x-5,y+2,3,8);
    ctx.fillRect(x+2,y+2,3,8);
  }else{
    ctx.fillRect(x-6,y+2,3,8);
    ctx.fillRect(x+3,y+2,3,8);
  }
  // body
  ctx.fillStyle=P.shirt;
  ctx.fillRect(x-6,y-8,12,12);
  // head
  ctx.fillStyle=P.skin;
  ctx.fillRect(x-5,y-18,10,10);
  // hair
  ctx.fillStyle=P.hair;
  ctx.fillRect(x-5,y-18,10,4);
  ctx.fillRect(x-5,y-16,2,2);
  ctx.fillRect(x+3,y-16,2,2);
  // eyes
  ctx.fillStyle='#000';
  if(player.dir==='down'){
    ctx.fillRect(x-3,y-13,1,1);
    ctx.fillRect(x+2,y-13,1,1);
  }
}

function render(){
  ctx.save();
  ctx.translate(-camX,-camY);
  drawGrass();
  drawPaths();
  // trees around edges
  for(let i=0;i<8;i++)drawTree(i*3+1,0);
  for(let i=0;i<8;i++)drawTree(i*3+1,15);
  for(let i=0;i<4;i++)drawTree(0,i*4+2);
  for(let i=0;i<4;i++)drawTree(24,i*4+2);
  // plots
  for(const k in plots){const[gx,gy]=k.split(',').map(Number);drawPlot(gx,gy,plots[k]);}
  // buildings
  drawHouse(4,3,4,3);
  drawMarket(10,3,3,3);
  drawStudio(15,3,4,3);
  drawPlayer();
  ctx.restore();
}

function updateCamera(){
  camX=Math.max(0,Math.min(player.x*TILE-cv.width/2,COLS*TILE-cv.width));
  camY=Math.max(0,Math.min(player.y*TILE-cv.height/2,ROWS*TILE-cv.height));
}

// pathfinding (simple BFS)
function findPath(sx,sy,tx,ty){
  const blocked=(x,y)=>{
    for(const b of buildings)if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h)return true;
    return x<0||x>=COLS||y<0||y>=ROWS;
  };
  if(blocked(tx,ty))return null;
  const open=[{x:sx,y:sy,path:[]}],closed=new Set();
  while(open.length){
    open.sort((a,b)=>Math.abs(a.x-tx)+Math.abs(a.y-ty)-(Math.abs(b.x-tx)+Math.abs(b.y-ty)));
    const cur=open.shift(),key=cur.x+','+cur.y;
    if(closed.has(key))continue;closed.add(key);
    if(cur.x===tx&&cur.y===ty)return cur.path.slice(1);
    for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){
      const nx=cur.x+dx,ny=cur.y+dy;
      if(blocked(nx,ny))continue;
      open.push({x:nx,y:ny,path:[...cur.path,{x:nx,y:ny}]});
    }
  }
  return null;
}

cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const wx=(e.clientX-r.left+camX)/TILE;
  const wy=(e.clientY-r.top+camY)/TILE;
  const gx=Math.floor(wx),gy=Math.floor(wy);
  const p=findPath(Math.round(player.x),Math.round(player.y),gx,gy);
  if(p){player.path=p;player.moving=true;}
});

let lastT=performance.now();
function loop(t){
  const dt=(t-lastT)/1000;lastT=t;
  if(player.path.length){
    const nxt=player.path[0];
    const dx=nxt.x-player.x,dy=nxt.y-player.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    const speed=4;
    if(d<.05){
      player.path.shift();
      if(!player.path.length){player.moving=false;}
    }else{
      player.x+=dx/d*speed*dt;
      player.y+=dy/d*speed*dt;
      player.walkFrame+=dt*8;
      if(Math.abs(dx)>Math.abs(dy))player.dir=dx>0?'right':'left';
      else player.dir=dy>0?'down':'up';
    }
  }
  updateCamera();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
