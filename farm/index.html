<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的农场 · SolYoung</title>
<meta name="description" content="星露谷风格的项目地图：每块地都是一个正在生长的项目。">
<style>
:root{
  --bg:#1a2f1a;
  --ink:#2d1f0e;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#2a4a2a;color:#fff;font-family:"Courier New",monospace;min-height:100%}
.wrap{max-width:1100px;margin:0 auto;padding:30px 16px 50px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;gap:10px}
.head h1{font-size:clamp(20px,3vw,28px);color:#fff;text-shadow:2px 2px 0 #000;letter-spacing:2px}
.back{color:#fff;opacity:.7;text-decoration:none;font-size:13px}
.back:hover{opacity:1;color:#ffd97a}
.sub{font-size:13px;color:#cfe3c9;margin-bottom:20px;line-height:1.6;text-shadow:1px 1px 0 #000}
.map{background:#5a8c3a;border:4px solid #2d1f0e;box-shadow:0 0 0 4px #8b6f47, 0 8px 0 4px rgba(0,0,0,.3);padding:10px;image-rendering:pixelated}
.map svg{width:100%;height:auto;display:block;image-rendering:pixelated;shape-rendering:crispEdges}
.hint{margin-top:16px;font-size:11px;color:#cfe3c9;text-align:center;opacity:.8;letter-spacing:1px;text-shadow:1px 1px 0 #000}
a{cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>★ 我的农场</h1>
    <a class="back" href="/">← 离开农场</a>
  </div>
  <p class="sub">春天的农场，每块地都种着一个项目。走过去看看吧。</p>

  <div class="map">
    <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
      <!-- grass base -->
      <rect width="800" height="600" fill="#5a8c3a"/>
      <!-- grass texture speckles -->
      <g fill="#4d7a30">
        <rect x="40" y="40" width="6" height="6"/><rect x="120" y="80" width="4" height="4"/>
        <rect x="220" y="50" width="6" height="6"/><rect x="350" y="100" width="4" height="4"/>
        <rect x="500" y="60" width="6" height="6"/><rect x="650" y="90" width="4" height="4"/>
        <rect x="720" y="50" width="6" height="6"/><rect x="80" y="180" width="4" height="4"/>
        <rect x="180" y="220" width="6" height="6"/><rect x="400" y="200" width="4" height="4"/>
        <rect x="600" y="200" width="6" height="6"/><rect x="700" y="250" width="4" height="4"/>
        <rect x="30" y="350" width="6" height="6"/><rect x="200" y="400" width="4" height="4"/>
        <rect x="550" y="380" width="6" height="6"/><rect x="730" y="420" width="4" height="4"/>
        <rect x="100" y="520" width="6" height="6"/><rect x="400" y="540" width="4" height="4"/>
        <rect x="650" y="530" width="6" height="6"/>
      </g>
      <g fill="#6b9e47">
        <rect x="60" y="120" width="4" height="4"/><rect x="280" y="150" width="6" height="6"/>
        <rect x="450" y="120" width="4" height="4"/><rect x="680" y="150" width="6" height="6"/>
        <rect x="150" y="300" width="4" height="4"/><rect x="380" y="320" width="6" height="6"/>
        <rect x="620" y="320" width="4" height="4"/><rect x="50" y="480" width="4" height="4"/>
        <rect x="300" y="480" width="6" height="6"/><rect x="580" y="480" width="4" height="4"/>
      </g>

      <!-- dirt path -->
      <rect x="370" y="0" width="60" height="600" fill="#8b6f47"/>
      <rect x="370" y="0" width="60" height="600" fill="#7a5f3a"/>
      <g fill="#6b4f2a">
        <rect x="385" y="50" width="8" height="6"/><rect x="405" y="120" width="6" height="8"/>
        <rect x="390" y="200" width="10" height="6"/><rect x="410" y="280" width="6" height="6"/>
        <rect x="385" y="360" width="8" height="8"/><rect x="405" y="440" width="10" height="6"/>
        <rect x="390" y="520" width="6" height="6"/>
      </g>

      <!-- fence around whole farm -->
      <g fill="#c9a06a">
        <rect x="0" y="0" width="800" height="12"/><rect x="0" y="588" width="800" height="12"/>
        <rect x="0" y="0" width="12" height="600"/><rect x="788" y="0" width="12" height="600"/>
      </g>
      <g fill="#8b6f47">
        <rect x="40" y="0" width="6" height="12"/><rect x="100" y="0" width="6" height="12"/>
        <rect x="160" y="0" width="6" height="12"/><rect x="220" y="0" width="6" height="12"/>
        <rect x="280" y="0" width="6" height="12"/><rect x="340" y="0" width="6" height="12"/>
        <rect x="460" y="0" width="6" height="12"/><rect x="520" y="0" width="6" height="12"/>
        <rect x="580" y="0" width="6" height="12"/><rect x="640" y="0" width="6" height="12"/>
        <rect x="700" y="0" width="6" height="12"/><rect x="760" y="0" width="6" height="12"/>
      </g>

      <!-- MAIN HOUSE (top-left) -->
      <a href="/">
        <g>
          <!-- house body -->
          <rect x="60" y="80" width="140" height="100" fill="#e8d4a8"/>
          <rect x="60" y="80" width="140" height="100" fill="none" stroke="#8b6f47" stroke-width="3"/>
          <!-- roof red -->
          <polygon points="50,85 130,30 210,85" fill="#c0392b"/>
          <polygon points="50,85 130,30 210,85" fill="none" stroke="#8b2a1a" stroke-width="3"/>
          <!-- door -->
          <rect x="115" y="130" width="30" height="50" fill="#6b4f2a"/>
          <rect x="138" y="155" width="4" height="4" fill="#ffd97a"/>
          <!-- windows -->
          <rect x="75" y="105" width="22" height="22" fill="#a8d8ea" stroke="#6b4f2a" stroke-width="2"/>
          <rect x="160" y="105" width="22" height="22" fill="#a8d8ea" stroke="#6b4f2a" stroke-width="2"/>
          <rect x="83" y="113" width="6" height="6" fill="#fff"/>
          <rect x="168" y="113" width="6" height="6" fill="#fff"/>
          <!-- label -->
          <rect x="75" y="195" width="110" height="20" fill="#fff" stroke="#2d1f0e" stroke-width="2"/>
          <text x="130" y="210" font-family="Courier New,monospace" font-size="13" font-weight="bold" fill="#2d1f0e" text-anchor="middle">主屋 · 主页</text>
        </g>
      </a>

      <!-- BARN / SOLHUB (top-right) -->
      <a href="https://solhub.solyoung.top/" target="_blank" rel="noopener">
        <g>
          <!-- barn body -->
          <rect x="540" y="90" width="150" height="110" fill="#e8d4a8"/>
          <rect x="540" y="90" width="150" height="110" fill="none" stroke="#8b6f47" stroke-width="3"/>
          <!-- roof -->
          <polygon points="530,95 615,35 700,95" fill="#8b2a1a"/>
          <polygon points="530,95 615,35 700,95" fill="none" stroke="#5a1a10" stroke-width="3"/>
          <!-- big barn door X -->
          <rect x="585" y="135" width="60" height="65" fill="#c0392b"/>
          <line x1="585" y1="135" x2="645" y2="200" stroke="#fff" stroke-width="3"/>
          <line x1="645" y1="135" x2="585" y2="200" stroke="#fff" stroke-width="3"/>
          <!-- loft window -->
          <rect x="605" y="100" width="20" height="20" fill="#a8d8ea" stroke="#6b4f2a" stroke-width="2"/>
          <!-- label -->
          <rect x="545" y="215" width="140" height="20" fill="#fff" stroke="#2d1f0e" stroke-width="2"/>
          <text x="615" y="230" font-family="Courier New,monospace" font-size="13" font-weight="bold" fill="#2d1f0e" text-anchor="middle">谷仓 · SolHub</text>
        </g>
      </a>

      <!-- WORKSHOP / STUDIO (right) -->
      <a href="https://studio.solyoung.top/" target="_blank" rel="noopener">
        <g>
          <rect x="560" y="280" width="110" height="80" fill="#d4a76a"/>
          <rect x="560" y="280" width="110" height="80" fill="none" stroke="#6b4f2a" stroke-width="3"/>
          <polygon points="555,285 615,245 675,285" fill="#6b4f2a"/>
          <rect x="595" y="315" width="40" height="45" fill="#3a2a1a"/>
          <!-- tools -->
          <rect x="570" y="295" width="12" height="12" fill="#c0392b"/>
          <rect x="640" y="295" width="12" height="12" fill="#a8d8ea"/>
          <rect x="555" y="375" width="120" height="20" fill="#fff" stroke="#2d1f0e" stroke-width="2"/>
          <text x="615" y="390" font-family="Courier New,monospace" font-size="12" font-weight="bold" fill="#2d1f0e" text-anchor="middle">工坊 · Studio</text>
        </g>
      </a>

      <!-- TREE / GitHub (left) -->
      <a href="https://github.com/SolYoung-Ai" target="_blank" rel="noopener">
        <g>
          <rect x="100" y="290" width="14" height="40" fill="#6b4f2a"/>
          <circle cx="107" cy="275" r="35" fill="#3a6b2a"/>
          <circle cx="85" cy="290" r="20" fill="#4d7a30"/>
          <circle cx="130" cy="290" r="20" fill="#4d7a30"/>
          <!-- apples -->
          <circle cx="90" cy="270" r="4" fill="#c0392b"/>
          <circle cx="120" cy="265" r="4" fill="#c0392b"/>
          <circle cx="107" cy="295" r="4" fill="#c0392b"/>
          <rect x="60" y="340" width="95" height="20" fill="#fff" stroke="#2d1f0e" stroke-width="2"/>
          <text x="107" y="355" font-family="Courier New,monospace" font-size="12" font-weight="bold" fill="#2d1f0e" text-anchor="middle">大树 · GitHub</text>
        </g>
      </a>

      <!-- FIELD 1: Verity (bottom-left) -->
      <a href="/Verity/">
        <g>
          <!-- tilled soil -->
          <rect x="60" y="400" width="130" height="100" fill="#6b4f2a"/>
          <g fill="#5a3f1a">
            <rect x="60" y="420" width="130" height="4"/>
            <rect x="60" y="445" width="130" height="4"/>
            <rect x="60" y="470" width="130" height="4"/>
            <rect x="60" y="495" width="130" height="4"/>
          </g>
          <!-- crops growing -->
          <g fill="#c0392b">
            <circle cx="80" cy="432" r="5"/><circle cx="110" cy="432" r="5"/><circle cx="140" cy="432" r="5"/><circle cx="170" cy="432" r="5"/>
          </g>
          <g fill="#e87028">
            <circle cx="95" cy="457" r="5"/><circle cx="125" cy="457" r="5"/><circle cx="155" cy="457" r="5"/>
          </g>
          <g fill="#ffd97a">
            <circle cx="80" cy="482" r="5"/><circle cx="110" cy="482" r="5"/><circle cx="140" cy="482" r="5"/><circle cx="170" cy="482" r="5"/>
          </g>
          <rect x="60" y="510" width="130" height="20" fill="#fff" stroke="#2d1f0e" stroke-width="2"/>
          <text x="125" y="525" font-family="Courier New,monospace" font-size="12" font-weight="bold" fill="#2d1f0e" text-anchor="middle">菜地 · Verity</text>
        </g>
      </a>

      <!-- FIELD 2: CamSim (bottom-center) -->
      <a href="/CamSim/">
        <g>
          <rect x="290" y="400" width="130" height="100" fill="#6b4f2a"/>
          <g fill="#5a3f1a">
            <rect x="290" y="420" width="130" height="4"/>
            <rect x="290" y="445" width="130" height="4"/>
            <rect x="290" y="470" width="130" height="4"/>
            <rect x="290" y="495" width="130" height="4"/>
          </g>
          <g fill="#a8d8ea">
            <circle cx="310" cy="432" r="5"/><circle cx="340" cy="432" r="5"/><circle cx="370" cy="432" r="5"/><circle cx="400" cy="432" r="5"/>
          </g>
          <g fill="#c9a06a">
            <circle cx="325" cy="457" r="5"/><circle cx="355" cy="457" r="5"/><circle cx="385" cy="457" r="5"/>
          </g>
          <g fill="#e87028">
            <circle cx="310" cy="482" r="5"/><circle cx="340" cy="482" r="5"/><circle cx="370" cy="482" r="5"/><circle cx="400" cy="482" r="5"/>
          </g>
          <rect x="290" y="510" width="130" height="20" fill="#fff" stroke="#2d1f0e" stroke-width="2"/>
          <text x="355" y="525" font-family="Courier New,monospace" font-size="12" font-weight="bold" fill="#2d1f0e" text-anchor="middle">菜地 · CamSim</text>
        </g>
      </a>

      <!-- FIELD 3: MyOS (bottom-right) -->
      <a href="/OS/">
        <g>
          <rect x="520" y="400" width="130" height="100" fill="#6b4f2a"/>
          <g fill="#5a3f1a">
            <rect x="520" y="420" width="130" height="4"/>
            <rect x="520" y="445" width="130" height="4"/>
            <rect x="520" y="470" width="130" height="4"/>
            <rect x="520" y="495" width="130" height="4"/>
          </g>
          <g fill="#3a6b2a">
            <rect x="535" y="425" width="10" height="14"/><rect x="565" y="425" width="10" height="14"/>
            <rect x="595" y="425" width="10" height="14"/><rect x="625" y="425" width="10" height="14"/>
          </g>
          <g fill="#e87028">
            <circle cx="545" cy="465" r="5"/><circle cx="575" cy="465" r="5"/><circle cx="605" cy="465" r="5"/><circle cx="635" cy="465" r="5"/>
          </g>
          <g fill="#ffd97a">
            <circle cx="560" cy="490" r="5"/><circle cx="590" cy="490" r="5"/><circle cx="620" cy="490" r="5"/>
          </g>
          <rect x="520" y="510" width="130" height="20" fill="#fff" stroke="#2d1f0e" stroke-width="2"/>
          <text x="585" y="525" font-family="Courier New,monospace" font-size="12" font-weight="bold" fill="#2d1f0e" text-anchor="middle">菜地 · MyOS</text>
        </g>
      </a>

      <!-- well decoration -->
      <g>
        <rect x="290" y="100" width="40" height="30" fill="#8b6f47"/>
        <rect x="295" y="105" width="30" height="20" fill="#3a5f7a"/>
        <polygon points="285,100 310,75 335,100" fill="#c0392b"/>
      </g>

      <!-- sun -->
      <circle cx="400" cy="30" r="18" fill="#ffd97a"/>
      <g stroke="#ffd97a" stroke-width="3">
        <line x1="400" y1="5" x2="400" y2="12"/>
        <line x1="400" y1="48" x2="400" y2="55"/>
        <line x1="375" y1="30" x2="382" y2="30"/>
        <line x1="418" y1="30" x2="425" y2="30"/>
      </g>
    </svg>
  </div>
  <p class="hint">★ 点击建筑或菜地进入对应项目 · 新的作物会随项目长出 ★</p>
</div>
</body>
</html>
