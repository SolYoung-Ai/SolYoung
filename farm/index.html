<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的农场 · SolYoung</title>
<meta name="description" content="星露谷风格的项目地图：每栋房子、每块菜地都是一个正在生长的项目。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#2a4a2a;color:#fff;font-family:"Courier New",monospace;min-height:100%}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 40px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:10px}
.head h1{font-size:clamp(20px,3vw,28px);text-shadow:2px 2px 0 #000;letter-spacing:2px}
.back{color:#fff;opacity:.7;text-decoration:none;font-size:13px}
.back:hover{opacity:1;color:#ffd97a}
.sub{font-size:13px;color:#cfe3c9;margin-bottom:16px;line-height:1.6;text-shadow:1px 1px 0 #000}
.map{position:relative;border:4px solid #2d1f0e;box-shadow:0 0 0 4px #8b6f47,0 8px 0 4px rgba(0,0,0,.3);overflow:hidden}
.map img{display:block;width:100%;height:auto;image-rendering:pixelated}
.hotspot{position:absolute;display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:6px;transition:background .2s}
.hotspot:hover{background:rgba(232,112,40,.25);box-shadow:inset 0 0 0 2px #E87028}
.tag{position:absolute;bottom:8px;left:50%;transform:translateX(-50%) translateY(4px);background:#fff;color:#2d1f0e;font-size:12px;font-weight:bold;padding:3px 10px;border:2px solid #2d1f0e;white-space:nowrap;opacity:0;transition:all .2s;pointer-events:none;letter-spacing:1px}
.hotspot:hover .tag{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{margin-top:14px;font-size:11px;color:#cfe3c9;text-align:center;opacity:.8;letter-spacing:1px;text-shadow:1px 1px 0 #000}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>★ 我的农场</h1>
    <a class="back" href="/">← 离开农场</a>
  </div>
  <p class="sub">春天的农场，每栋房子、每块地都种着一个项目。把鼠标移上去看看，点进去走走。</p>

  <div class="map">
    <img src="assets/farm-bg.png" alt="SolYoung 农场地图">

    <!-- 左上：红屋顶主屋 → 个人主页 -->
    <a class="hotspot" href="/" style="left:7%;top:10%;width:26%;height:38%">
      <span class="tag">主屋 · 个人主页</span>
    </a>

    <!-- 中上：小棚 → Studio -->
    <a class="hotspot" href="https://studio.solyoung.top/" target="_blank" rel="noopener" style="left:37%;top:8%;width:15%;height:30%">
      <span class="tag">工坊 · Studio</span>
    </a>

    <!-- 右上：红谷仓 → SolHub -->
    <a class="hotspot" href="https://solhub.solyoung.top/" target="_blank" rel="noopener" style="left:68%;top:8%;width:25%;height:36%">
      <span class="tag">谷仓 · SolHub</span>
    </a>

    <!-- 中间大树 → GitHub -->
    <a class="hotspot" href="https://github.com/SolYoung-Ai" target="_blank" rel="noopener" style="left:50%;top:14%;width:18%;height:34%">
      <span class="tag">大树 · GitHub</span>
    </a>

    <!-- 左下菜地 → Verity -->
    <a class="hotspot" href="/Verity/" style="left:5%;top:56%;width:28%;height:32%">
      <span class="tag">菜地 · Verity</span>
    </a>

    <!-- 中下菜地 → CamSim -->
    <a class="hotspot" href="/CamSim/" style="left:34%;top:56%;width:29%;height:32%">
      <span class="tag">菜地 · CamSim</span>
    </a>

    <!-- 右下菜地 → MyOS -->
    <a class="hotspot" href="/OS/" style="left:64%;top:56%;width:28%;height:32%">
      <span class="tag">菜地 · MyOS</span>
    </a>
  </div>
  <p class="hint">★ 点击建筑或菜地进入对应项目 · 新的作物会随项目长出 ★</p>
</div>
</body>
</html>
