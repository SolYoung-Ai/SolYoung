<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SolYoung Farm</title>
<style>
:root{
  --grass:#6a9e3f; --grass-d:#5a8c35; --dirt:#8b6f47; --dirt-wet:#5a452a;
  --wood:#8b5a2a; --wood-d:#5a3a1a; --roof:#b83a2a;
  --ink:#2d1f0e; --accent:#E87028; --panel:#3a2a1a; --gold:#ffd97a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#2a4a2a;color:#fff;font-family:"Courier New",monospace;min-height:100%;touch-action:manipulation}
.wrap{max-width:900px;margin:0 auto;padding:12px 10px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.topbar h1{font-size:16px;text-shadow:2px 2px 0 #000;letter-spacing:2px}
.topbar .back{color:#fff;opacity:.7;text-decoration:none;font-size:12px}
.topbar .back:hover{color:var(--gold)}
.status{display:flex;gap:12px;font-size:12px;background:var(--panel);padding:5px 10px;border:2px solid var(--wood-d);border-radius:4px}
.status b{color:var(--gold)}

.world{position:relative;width:100%;aspect-ratio:20/14;background:var(--grass);border:4px solid var(--wood-d);box-shadow:0 0 0 3px var(--wood),0 6px 0 3px rgba(0,0,0,.3);overflow:hidden;image-rendering:pixelated;cursor:pointer}
.tile{position:absolute}
.tile.path{background:#b8a070}
.tile.tilled{background:var(--dirt)}
.tile.wet{background:var(--dirt-wet)}

.building{position:absolute;image-rendering:pixelated}
.building svg{display:block;width:100%;height:100%;image-rendering:pixelated}
.bsign{position:absolute;left:50%;top:6%;transform:translateX(-50%);background:var(--wood);color:#fff;padding:2px 8px;border:2px solid var(--wood-d);font-size:11px;font-weight:bold;letter-spacing:1px;white-space:nowrap;cursor:pointer;text-shadow:1px 1px 0 #000}
.bsign:hover{background:var(--accent)}

.player{position:absolute;width:3.5%;height:5%;z-index:15;transform:translate(-50%,-80%);pointer-events:none}
.player svg{width:100%;height:100%;image-rendering:pixelated}
.player.flip svg{transform:scaleX(-1)}
.player.walking{animation:bob .3s infinite}
@keyframes bob{0%,100%{transform:translate(-50%,-80%)}50%{transform:translate(-50%,-83%)}}

.toolbar{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;background:var(--panel);padding:8px;border:2px solid var(--wood-d);border-radius:4px;align-items:center}
.tool{width:44px;height:44px;background:var(--wood);border:2px solid var(--wood-d);border-radius:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:#fff;position:relative;transition:transform .1s}
.tool:hover{transform:translateY(-2px)}
.tool.active{background:var(--accent);border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.tool .icon{font-size:16px;line-height:1}
.tool .count{position:absolute;right:1px;bottom:1px;background:#000;color:var(--gold);font-size:8px;padding:0 2px;border-radius:2px}
.spacer{flex:1}
.btn{background:var(--wood);color:#fff;border:2px solid var(--wood-d);padding:7px 12px;cursor:pointer;font-family:inherit;font-size:11px;border-radius:3px}
.btn:hover{background:var(--accent)}
.btn.gold{background:var(--gold);color:var(--ink)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
.modal.show{display:flex}
.panel{background:var(--panel);border:3px solid var(--wood-d);border-radius:6px;padding:18px;max-width:400px;width:100%;max-height:80vh;overflow:auto}
.panel h2{font-size:15px;margin-bottom:10px;color:var(--gold)}
.panel .row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed #5a4a2a;font-size:12px}
.panel .row:last-child{border:none}
.panel .actions{margin-top:12px;display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#000;color:var(--gold);padding:7px 14px;border:2px solid var(--accent);font-size:12px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.tip{margin-top:6px;font-size:10px;color:#cfe3c9;opacity:.8;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>★ SolYoung Farm</h1>
    <div class="status">
      <span>Day <b id="ui-day">1</b></span>
      <span>Gold <b id="ui-gold">50</b></span>
    </div>
    <a class="back" href="/">← 网站</a>
  </div>

  <div class="world" id="world">
    <!-- paths -->
    <div class="tile path" style="left:25%;top:35%;width:50%;height:3%"></div>
    <div class="tile path" style="left:48%;top:38%;width:4%;height:55%"></div>

    <!-- house -->
    <div class="building" style="left:5%;top:10%;width:22%;height:30%">
      <svg viewBox="0 0 200 140" shape-rendering="crispEdges">
        <rect x="30" y="50" width="140" height="80" fill="#e8d4a8" stroke="#8b5a2a" stroke-width="3"/>
        <polygon points="20,55 100,10 180,55" fill="#b83a2a" stroke="#7a2015" stroke-width="3"/>
        <rect x="85" y="90" width="30" height="40" fill="#5a3a1a"/>
        <rect x="45" y="70" width="22" height="22" fill="#a8d8ea" stroke="#5a3a1a" stroke-width="2"/>
        <rect x="133" y="70" width="22" height="22" fill="#a8d8ea" stroke="#5a3a1a" stroke-width="2"/>
      </svg>
      <div class="bsign" data-spot="house">SOLYOUNG.TOP</div>
    </div>

    <!-- market -->
    <div class="building" style="left:39%;top:14%;width:18%;height:26%">
      <svg viewBox="0 0 160 120" shape-rendering="crispEdges">
        <rect x="20" y="50" width="120" height="60" fill="#c9a06a" stroke="#6b4f2a" stroke-width="3"/>
        <rect x="20" y="35" width="120" height="18" fill="#c0392b"/>
        <rect x="20" y="35" width="20" height="18" fill="#fff"/>
        <rect x="60" y="35" width="20" height="18" fill="#fff"/>
        <rect x="100" y="35" width="20" height="18" fill="#fff"/>
        <rect x="55" y="75" width="50" height="35" fill="#5a3a1a"/>
      </svg>
      <div class="bsign" data-spot="market">DIGITAL MARKET</div>
    </div>

    <!-- studio -->
    <div class="building" style="left:68%;top:10%;width:22%;height:30%">
      <svg viewBox="0 0 200 140" shape-rendering="crispEdges">
        <rect x="30" y="60" width="140" height="70" fill="#d4a76a" stroke="#5a3a1a" stroke-width="3"/>
        <polygon points="25,65 100,25 175,65" fill="#5a3a1a"/>
        <rect x="80" y="90" width="40" height="40" fill="#2d1f0e"/>
        <rect x="45" y="75" width="20" height="18" fill="#a8d8ea" stroke="#5a3a1a" stroke-width="2"/>
      </svg>
      <div class="bsign" data-spot="studio">STUDIO</div>
    </div>

    <div class="player" id="player">
      <svg viewBox="0 0 16 22" shape-rendering="crispEdges">
        <rect x="1" y="8" width="3" height="7" fill="#3a4a5a"/>
        <rect x="4" y="0" width="9" height="3" fill="#5a3a20"/>
        <rect x="3" y="2" width="11" height="2" fill="#5a3a20"/>
        <rect x="4" y="4" width="9" height="5" fill="#f0c8a0"/>
        <rect x="6" y="5" width="1" height="1" fill="#000"/>
        <rect x="10" y="5" width="1" height="1" fill="#000"/>
        <rect x="4" y="9" width="9" height="6" fill="#8a8a8a"/>
        <rect x="2" y="9" width="2" height="4" fill="#f0c8a0"/>
        <rect x="13" y="9" width="2" height="4" fill="#f0c8a0"/>
        <rect x="4" y="15" width="9" height="3" fill="#2d1f0e"/>
        <rect x="5" y="18" width="2" height="3" fill="#f0c8a0"/>
        <rect x="10" y="18" width="2" height="3" fill="#f0c8a0"/>
        <rect x="5" y="21" width="2" height="1" fill="#2d1f0e"/>
        <rect x="10" y="21" width="2" height="1" fill="#2d1f0e"/>
      </svg>
    </div>
  </div>

  <div class="toolbar">
    <div class="tool active" data-tool="hand"><span class="icon">✋</span>手</div>
    <div class="tool" data-tool="hoe"><span class="icon">⛏️</span>锄</div>
    <div class="tool" data-tool="seed-radish"><span class="icon">🥬</span>萝卜<span class="count" id="cnt-radish-seed">3</span></div>
    <div class="tool" data-tool="seed-tomato"><span class="icon">🍅</span>番茄<span class="count" id="cnt-tomato-seed">2</span></div>
    <div class="tool" data-tool="seed-berry"><span class="icon">🍓</span>草莓<span class="count" id="cnt-berry-seed">1</span></div>
    <div class="tool" data-tool="water"><span class="icon">💧</span>壶</div>
    <div class="spacer"></div>
    <button class="btn" id="btn-bag">背包</button>
    <button class="btn" id="btn-day">结束今日</button>
    <button class="btn gold" id="btn-reset">重置</button>
  </div>
  <p class="tip">点地面走路 · 选种子后点翻好的地播种 · 浇水后点"结束今日"生长</p>

  <div class="modal" id="modal">
    <div class="panel">
      <h2 id="m-title"></h2>
      <div id="m-body"></div>
      <div class="actions">
        <button class="btn" id="m-close">关闭</button>
        <button class="btn gold" id="m-action" style="display:none"></button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
const SAVE='solyoung_farm_v2';
const COLS=20, ROWS=14;
const FARM={x0:5,x1:14,y0:9,y1:12};
const OBSTACLES=[
  {x0:2,x1:6,y0:2,y1:5},
  {x0:7,x1:10,y0:2,y1:5},
  {x0:14,x1:18,y0:2,y1:5},
];
const CROPS={
  radish:{name:'萝卜',days:3,sell:15,color:'#c0392b'},
  tomato:{name:'番茄',days:5,sell:35,color:'#e87028'},
  berry:{name:'草莓',days:7,sell:60,color:'#d6487a'},
};

let state, currentTool='hand', player={x:10,y:13}, path=[];
const world=document.getElementById('world');
const playerEl=document.getElementById('player');

function defaultState(){
  const plots={};
  for(let y=FARM.y0;y<=FARM.y1;y++)for(let x=FARM.x0;x<=FARM.x1;x++)
    plots[x+','+y]={tilled:false,watered:false,crop:null,growth:0};
  return {day:1,gold:50,seeds:{radish:3,tomato:2,berry:1},bag:{radish:0,tomato:0,berry:0},plots};
}
function load(){
  try{const r=localStorage.getItem(SAVE);if(r){state=JSON.parse(r);if(state.plots)return;}}catch(e){}
  state=defaultState();save();
}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(state));}catch(e){}}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
function beep(f){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);o.start();g.gain.value=.05;o.stop(a.currentTime+.1);}catch(e){}}

function updateUI(){
  document.getElementById('ui-day').textContent=state.day;
  document.getElementById('ui-gold').textContent=state.gold;
  document.getElementById('cnt-radish-seed').textContent=state.seeds.radish;
  document.getElementById('cnt-tomato-seed').textContent=state.seeds.tomato;
  document.getElementById('cnt-berry-seed').textContent=state.seeds.berry;
}

function renderPlots(){
  document.querySelectorAll('.tile[data-plot]').forEach(e=>e.remove());
  for(const k in state.plots){
    const p=state.plots[k],[gx,gy]=k.split(',').map(Number);
    const el=document.createElement('div');
    el.className='tile'+(p.tilled?(p.wet?' wet':' tilled'):'');
    el.dataset.plot=k;
    el.style.left=(gx/COLS*100)+'%';el.style.top=(gy/ROWS*100)+'%';
    el.style.width=(1/COLS*100)+'%';el.style.height=(1/ROWS*100)+'%';
    if(p.crop){
      const c=CROPS[p.crop];
      const stage=p.growth;
      const sz=stage<2?30:stage<4?55:80;
      const col=stage<2?'#4d7a30':stage<4?'#3a6b2a':c.color;
      el.innerHTML=`<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:${sz}%;height:${sz}%;background:${col};border-radius:${sz<50?2:5}px;border:2px solid rgba(0,0,0,.3)"></div>`;
    }
    world.appendChild(el);
  }
}

function inObstacle(x,y){for(const o of OBSTACLES)if(x>=o.x0&&x<=o.x1&&y>=o.y0&&y<=o.y1)return true;return false;}

function findPath(sx,sy,tx,ty){
  if(inObstacle(tx,ty)||tx<0||tx>=COLS||ty<0||ty>=ROWS)return null;
  // simple greedy with wall avoidance: try direct, if blocked try going around horizontally
  const open=[{x:sx,y:sy,path:[]}],closed=new Set();
  while(open.length){
    open.sort((a,b)=>Math.abs(a.x-tx)+Math.abs(a.y-ty)-(Math.abs(b.x-tx)+Math.abs(b.y-ty)));
    const cur=open.shift();
    const key=cur.x+','+cur.y;
    if(closed.has(key))continue;closed.add(key);
    if(cur.x===tx&&cur.y===ty)return cur.path.slice(1);
    for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){
      const nx=cur.x+dx,ny=cur.y+dy;
      if(nx<0||nx>=COLS||ny<0||ny>=ROWS||inObstacle(nx,ny))continue;
      open.push({x:nx,y:ny,path:[...cur.path,{x:nx,y:ny}]});
    }
  }
  return null;
}

function renderPlayer(){
  playerEl.style.left=(player.x/COLS*100)+'%';
  playerEl.style.top=(player.y/ROWS*100)+'%';
}

let lastT=performance.now();
function loop(t){
  const dt=(t-lastT)/1000;lastT=t;
  if(path.length){
    const nxt=path[0];
    const dx=nxt.x-player.x,dy=nxt.y-player.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    const speed=5;
    if(d<.05){path.shift();if(!path.length){playerEl.classList.remove('walking');onArrive();}}
    else{
      player.x+=dx/d*speed*dt;player.y+=dy/d*speed*dt;
      if(Math.abs(dx)>0.05)playerEl.classList.toggle('flip',dx<0);
    }
    renderPlayer();
  }
  requestAnimationFrame(loop);
}

function goTo(tx,ty){
  const sx=Math.round(player.x),sy=Math.round(player.y);
  const p=findPath(sx,sy,tx,ty);
  if(!p){toast('走不过去');return;}
  path=p;playerEl.classList.add('walking');
}

function onArrive(){
  const gx=Math.round(player.x),gy=Math.round(player.y);
  const p=state.plots[gx+','+gy];
  if(p)doTool(p,gx+','+gy);
  if(gy<6){
    if(gx>=2&&gx<=6)openHouse();
    else if(gx>=7&&gx<=10)openMarket();
    else if(gx>=14&&gx<=18)openStudio();
  }
}

function doTool(p,key){
  if(currentTool==='hoe'){
    if(!p.tilled){p.tilled=true;beep(200);toast('翻好了');save();renderPlots();}
  }else if(currentTool.startsWith('seed-')){
    const type=currentTool.slice(5);
    if(!p.tilled){toast('先翻土');return;}
    if(p.crop){toast('这里有作物');return;}
    if(state.seeds[type]<=0){toast('没种子了');return;}
    state.seeds[type]--;p.crop=type;p.growth=0;p.watered=false;
    beep(400);toast('种下了'+CROPS[type].name);save();updateUI();renderPlots();
  }else if(currentTool==='water'){
    if(!p.crop){toast('没作物');return;}
    p.watered=true;beep(600);toast('浇过水');save();renderPlots();
  }else if(currentTool==='hand'){
    if(p.crop&&p.growth>=CROPS[p.crop].days){
      state.bag[p.crop]++;p.crop=null;p.tilled=false;p.watered=false;p.growth=0;
      beep(800);toast('收获了'+CROPS[p.crop].name);save();updateUI();renderPlots();
    }
  }
}

world.addEventListener('click',e=>{
  if(e.target.closest('.bsign'))return;
  const r=world.getBoundingClientRect();
  const gx=Math.floor((e.clientX-r.left)/r.width*COLS);
  const gy=Math.floor((e.clientY-r.top)/r.height*ROWS);
  goTo(gx,gy);
});

document.querySelectorAll('.tool').forEach(el=>{
  el.addEventListener('click',e=>{
    e.stopPropagation();
    document.querySelectorAll('.tool').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');currentTool=el.dataset.tool;
  });
});

document.getElementById('btn-day').addEventListener('click',()=>{
  state.day++;
  for(const k in state.plots){const p=state.plots[k];if(p.crop&&p.watered&&p.growth<CROPS[p.crop].days){p.growth++;p.watered=false;}}
  save();updateUI();renderPlots();beep(300);toast('第 '+state.day+' 天');
});

document.getElementById('btn-reset').addEventListener('click',()=>{
  if(confirm('清空存档重新开始？')){state=defaultState();save();updateUI();renderPlots();toast('新开始');}
});

const modal=document.getElementById('modal');
function openModal(title,body,actionText,actionFn){
  document.getElementById('m-title').textContent=title;
  document.getElementById('m-body').innerHTML=body;
  const act=document.getElementById('m-action');
  if(actionText){act.style.display='inline-block';act.textContent=actionText;act.onclick=actionFn;}
  else act.style.display='none';
  modal.classList.add('show');
}
document.getElementById('m-close').addEventListener('click',()=>modal.classList.remove('show'));

function openHouse(){openModal('主屋 · SolYoung','<p style="line-height:1.7;font-size:13px">我的个人主页，记录创作与实践。</p>','访问 solyoung.top',()=>location.href='/');}
function openStudio(){openModal('Studio · 数字服务工作室','<p style="line-height:1.7;font-size:13px">视频创作、AI 实践、数字产品定制。</p>','访问 studio.solyoung.top',()=>window.open('https://studio.solyoung.top/','_blank'));}
function openMarket(){
  openModal('Digital Market',
    `<div class="row"><span>萝卜种子 (5金)</span><button class="btn" onclick="buy('radish',5)">买</button></div>
     <div class="row"><span>番茄种子 (10金)</span><button class="btn" onclick="buy('tomato',10)">买</button></div>
     <div class="row"><span>草莓种子 (18金)</span><button class="btn" onclick="buy('berry',18)">买</button></div>
     <div class="row"><span>出售萝卜 (15金)</span><button class="btn" onclick="sell('radish',15)">卖</button></div>
     <div class="row"><span>出售番茄 (35金)</span><button class="btn" onclick="sell('tomato',35)">卖</button></div>
     <div class="row"><span>出售草莓 (60金)</span><button class="btn" onclick="sell('berry',60)">卖</button></div>`);
}
window.buy=(t,c)=>{if(state.gold<c){toast('金币不够');return;}state.gold-=c;state.seeds[t]++;save();updateUI();beep(500);toast('买了'+CROPS[t].name+'种子');};
window.sell=(t,p)=>{if(state.bag[t]<=0){toast('没有'+CROPS[t].name);return;}state.bag[t]--;state.gold+=p;save();updateUI();beep(700);toast('卖了'+p+'金');};

document.getElementById('btn-bag').addEventListener('click',()=>{
  openModal('背包',
    `<div class="row"><span>🥬 萝卜</span><span>${state.bag.radish}</span></div>
     <div class="row"><span>🍅 番茄</span><span>${state.bag.tomato}</span></div>
     <div class="row"><span>🍓 草莓</span><span>${state.bag.berry}</span></div>
     <div class="row"><span>💰 金币</span><span>${state.gold}</span></div>`);
});

load();updateUI();renderPlots();renderPlayer();
requestAnimationFrame(loop);
</script>
</body>
</html>
