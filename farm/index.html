<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的农场 · SolYoung</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#2a4a2a;color:#fff;font-family:"Courier New",monospace;min-height:100%}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 40px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:10px}
.head h1{font-size:clamp(20px,3vw,28px);text-shadow:2px 2px 0 #000;letter-spacing:2px}
.back{color:#fff;opacity:.7;text-decoration:none;font-size:13px}
.back:hover{opacity:1;color:#ffd97a}
.sub{font-size:13px;color:#cfe3c9;margin-bottom:16px;line-height:1.6;text-shadow:1px 1px 0 #000}
.map{position:relative;border:4px solid #2d1f0e;box-shadow:0 0 0 4px #8b6f47,0 8px 0 4px rgba(0,0,0,.3);overflow:hidden;cursor:crosshair;user-select:none}
.map img{display:block;width:100%;height:auto;image-rendering:pixelated;pointer-events:none}

/* pixel sign on buildings */
.sign{position:absolute;font-family:"Courier New",monospace;font-weight:bold;color:#fff;text-shadow:2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;letter-spacing:2px;white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none}
.sign small{display:block;font-size:10px;letter-spacing:3px;opacity:.85;margin-top:2px}

/* pixel character */
.player{position:absolute;width:36px;height:48px;transform:translate(-50%,-100%);z-index:10;pointer-events:none;will-change:left,top}
.player svg{width:100%;height:100%;display:block;image-rendering:pixelated}
.player.walking{animation:bob .25s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* toast */
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:#000;color:#ffd97a;font-size:13px;padding:8px 16px;border:2px solid #E87028;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>★ 我的农场</h1>
    <a class="back" href="/">← 离开农场</a>
  </div>
  <p class="sub">点一下地面，小人会走过去。走到房子里，就会自动进入那个项目。</p>

  <div class="map" id="map">
    <img src="assets/farm-bg.png" alt="SolYoung 农场">

    <!-- signs -->
    <div class="sign" style="left:26%;top:16%">solyoung.top<small>主屋</small></div>
    <div class="sign" style="left:67%;top:52%">SolHub<small>集市</small></div>
    <div class="sign" style="left:83%;top:10%">Studio<small>工坊</small></div>

    <!-- player -->
    <div class="player" id="player" style="left:50%;top:88%">
      <svg viewBox="0 0 18 24" shape-rendering="crispEdges">
        <!-- hair -->
        <rect x="4" y="0" width="10" height="3" fill="#4a3728"/>
        <rect x="3" y="2" width="12" height="2" fill="#4a3728"/>
        <!-- face -->
        <rect x="4" y="4" width="10" height="5" fill="#f0c8a0"/>
        <!-- eyes -->
        <rect x="6" y="5" width="1" height="1" fill="#000"/>
        <rect x="11" y="5" width="1" height="1" fill="#000"/>
        <!-- body (orange shirt) -->
        <rect x="4" y="9" width="10" height="7" fill="#E87028"/>
        <!-- arms -->
        <rect x="2" y="9" width="2" height="5" fill="#f0c8a0"/>
        <rect x="14" y="9" width="2" height="5" fill="#f0c8a0"/>
        <!-- pants -->
        <rect x="5" y="16" width="3" height="5" fill="#2a4a6a"/>
        <rect x="10" y="16" width="3" height="5" fill="#2a4a6a"/>
        <!-- shoes -->
        <rect x="5" y="21" width="3" height="2" fill="#3a2a1a"/>
        <rect x="10" y="21" width="3" height="2" fill="#3a2a1a"/>
      </svg>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
const map = document.getElementById('map');
const player = document.getElementById('player');
const toast = document.getElementById('toast');

// buildings: center position (% of map), radius (%), url, name
const buildings = [
  {cx:25, cy:45, r:14, url:'/', name:'主屋'},
  {cx:67, cy:67, r:10, url:'https://solhub.solyoung.top/', name:'SolHub 集市'},
  {cx:83, cy:30, r:10, url:'https://studio.solyoung.top/', name:'Studio 工坊'}
];

let pos = {x:50, y:88};      // current position %
let target = {x:50, y:88};
let walking = false;
let arrived = false;
let toastTimer = null;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'), 1800);
}

function setPos(x,y){
  pos = {x,y};
  player.style.left = x + '%';
  player.style.top = y + '%';
}

// click to move
map.addEventListener('click', (e)=>{
  const rect = map.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 100;
  const y = ((e.clientY - rect.top) / rect.height) * 100;
  target = {x,y};
  walking = true;
  arrived = false;
  player.classList.add('walking');
});

// movement loop
function tick(){
  if(walking){
    const dx = target.x - pos.x;
    const dy = target.y - pos.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist < 0.5){
      walking = false;
      player.classList.remove('walking');
      arrived = true;
      checkArrival();
    } else {
      const speed = 1.2; // % per frame
      setPos(pos.x + dx/dist*speed, pos.y + dy/dist*speed);
    }
  }
  requestAnimationFrame(tick);
}

function checkArrival(){
  for(const b of buildings){
    const dx = pos.x - b.cx;
    const dy = pos.y - b.cy;
    const d = Math.sqrt(dx*dx + dy*dy);
    if(d < b.r){
      showToast('走到了 ' + b.name + '，进入…');
      setTimeout(()=>{ window.location.href = b.url; }, 900);
      return;
    }
  }
}

setPos(pos.x, pos.y);
tick();
</script>
</body>
</html>
