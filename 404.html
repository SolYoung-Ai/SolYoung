<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verity人格测试</title>
<script>
(function () {
  var p = location.pathname;
  if (p.indexOf('/Verity') === 0) {
    // Verity 人格测试：加载其入口，React Router 以 basename=/Verity/ 接管当前 URL
    fetch('/Verity/index.html')
      .then(function (r) { return r.text(); })
      .then(function (html) {
        document.open(); document.write(html); document.close();
      })
      .catch(function () { location.replace('/Verity/'); });
  } else if (p.indexOf('/TypeAll') === 0) {
    // 旧域名兼容：加载旧入口
    fetch('/TypeAll/index.html')
      .then(function (r) { return r.text(); })
      .then(function (html) {
        document.open(); document.write(html); document.close();
      })
      .catch(function () { location.replace('/TypeAll/'); });
  } else {
    location.replace('/');
  }
})();
</script>
</head>
<body></body>
</html>
