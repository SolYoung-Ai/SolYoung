<style>
:root{
  --bg:#F7F7F5;--bg-soft:#F0F0ED;--ink:#1B1B19;--ink-soft:#6D6D67;--ink-faint:#9C9C95;
  --line:rgba(27,27,25,.14);--accent:#E87028;--card:#FCFCFB;
  --ease:cubic-bezier(.22,1,.36,1);
  --font-ios:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','Segoe UI',Roboto,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;
  --font-display:var(--font-ios);
  --font-serif:var(--font-ios);
  --font-body:var(--font-ios);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.container{max-width:760px;margin:0 auto;padding:0 24px}
.hd{position:sticky;top:36px;z-index:50;background:rgba(247,247,245,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);transition:top .4s var(--ease)}
html.xbar-closed .hd{top:0}
.hd-in{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand .dot{color:var(--accent)}
.back{font-family:var(--font-display);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);transition:color .3s}
.back:hover{color:var(--accent)}
.hd-r{display:flex;align-items:center;gap:16px}
.xlink{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:11px;letter-spacing:.14em;color:var(--ink-soft);transition:color .3s;white-space:nowrap}
.xlink .xlogo{color:#1d9bf0;display:inline-flex}
.xlink:hover{color:var(--accent)}
.hero{padding:52px 0 0}
/* ---------- 产品轮播条 ---------- */
.pv{margin:0}
.pv-rail{
  position:relative;
  overflow-x:auto;overflow-y:hidden;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none;
  cursor:grab;
  padding:10px 0 20px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 20px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 20px),transparent 100%);
}
.pv-rail::-webkit-scrollbar{display:none}
.pv-rail.dragging{cursor:grabbing;scroll-behavior:auto}
.pv-rail.dragging .pv-item{pointer-events:none}
.pv-track{display:flex;align-items:stretch;gap:9px;width:max-content}
.pv-item{
  display:inline-flex;flex-direction:column;align-items:center;gap:7px;
  flex:0 0 auto;
  min-width:86px;
  padding:11px 10px 9px;
  border-radius:20px;
  background:var(--glass-strong);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  box-shadow:
    inset 0 0 0 1px rgba(28,20,12,.055),
    0 2px 5px -2px rgba(40,26,12,.10),
    0 14px 28px -20px rgba(40,26,12,.4);
  transition:transform .42s var(--ios-spring),box-shadow .42s var(--ios-ease),background .3s;
}
.pv-item:hover{
  transform:translateY(-2px);
  box-shadow:
    inset 0 0 0 1px rgba(28,20,12,.075),
    0 4px 10px -4px rgba(40,26,12,.14),
    0 24px 44px -22px rgba(40,26,12,.46);
}
.pv-logo{
  width:66px;height:46px;flex:0 0 46px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .42s var(--ios-spring);
}
.pv-name{
  display:flex;align-items:center;justify-content:center;
  height:2.5em;overflow:hidden;
  font-family:var(--font-display);
  font-size:11.5px;font-weight:600;letter-spacing:-.005em;
  line-height:1.25;text-align:center;
  color:var(--ink-soft);
  transition:color .3s;
}
.pv-item:hover .pv-logo{transform:scale(1.06)}
.pv-logo img{
  width:100%;height:100%;display:block;
  object-fit:contain;
  mix-blend-mode:multiply;      /* 白底 logo 的白边融进背景，图案撑满 */
}
html[data-theme="dark"] .pv-logo{border-radius:11px;background:#fff;overflow:hidden}
html[data-theme="dark"] .pv-logo img{mix-blend-mode:normal;object-fit:cover;padding:0}
.pv-item:hover .pv-name{color:var(--accent)}
.kicker{font-family:var(--font-display);font-size:11px;letter-spacing:.2em;color:var(--ink-faint);text-transform:uppercase}
h1{font-family:var(--font-serif);font-weight:900;font-size:clamp(46px,9vw,82px);margin:14px 0 18px;letter-spacing:-.02em;line-height:.95}
h1 .accent{color:var(--accent)}
.sub{color:var(--ink-soft);font-size:15px;line-height:1.9;max-width:640px;margin:0}
.tl{margin-top:26px}
.tl-year{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.tl-year-num{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.1em;color:var(--ink)}
.tl-year-line{flex:1;height:1px;background:var(--line)}
.now-item{opacity:0;transform:translateY(18px);transition:opacity .55s var(--ease),transform .4s var(--ease);padding:30px 4px 34px;border-bottom:1px solid var(--line)}
.now-item.in{opacity:1;transform:none}
.now-head{display:flex;align-items:center;gap:10px}
.now-av{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none}
.now-name{font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--ink)}
.now-handle{font-size:12px;color:var(--ink-faint)}
.now-meta{display:flex;align-items:center;gap:10px;margin-top:12px;font-family:var(--font-display);font-size:11px;letter-spacing:.14em;color:var(--ink-soft)}
.now-type{color:var(--accent);transition:color .3s}
.now-date{color:var(--ink-faint);transition:color .3s}
.now-item:hover .now-type{color:var(--ink)}
.now-item:hover .now-date{color:var(--ink-soft)}
.now-body{margin-top:10px;font-size:16px;line-height:1.9;white-space:pre-line;color:var(--ink)}
.now-body.clamp{-webkit-line-clamp:4;line-clamp:4;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.now-media{margin-top:16px;overflow:hidden;border-radius:4px;display:inline-block}
.now-media img{display:block;max-width:100%;max-height:220px;width:auto;height:auto;cursor:zoom-in;transition:transform .45s var(--ease)}
.now-media:hover img{transform:scale(1.015)}
.lb{position:fixed;inset:0;z-index:300;background:rgba(20,18,14,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.lb.open{opacity:1;pointer-events:auto}
.lb img{max-width:92vw;max-height:88vh;border-radius:4px}
.lb-close{position:absolute;top:18px;right:22px;color:#fff;font-size:24px;background:none;border:none;cursor:pointer;opacity:.75;line-height:1;transition:opacity .3s}
.lb-close:hover{opacity:1}
.rlink{display:inline-block;margin-top:12px;font-family:var(--font-display);font-size:11px;letter-spacing:.12em;color:var(--accent);cursor:pointer;background:none;border:none;padding:0;transition:color .3s}
.rlink:hover{color:var(--ink)}
.ft{padding:76px 0 48px;text-align:center}
.ft .slogan{font-family:var(--font-serif);font-size:15px;color:var(--ink-soft);margin-bottom:10px}
.ft .muted{font-size:12px;color:var(--ink-faint)}
.fail{color:var(--ink-faint);font-size:13px;padding:24px 4px}
/* X promo bar */
.xbar{position:fixed;top:0;left:0;right:0;z-index:60;background:#0f1419;color:#e7e9ea;font-size:12.5px;transition:transform .4s var(--ease),opacity .3s}
.xbar.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
.xbar-inner{max-width:760px;margin:0 auto;padding:0 24px;height:36px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.xbar-link{display:flex;align-items:center;gap:8px;color:#e7e9ea;text-decoration:none;flex:1;min-width:0;overflow:hidden}
.xbar-logo{flex-shrink:0;color:#1d9bf0}
.xbar-avatar{width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid rgba(255,255,255,.15)}
.xbar-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.xbar-follow{flex-shrink:0;color:#1d9bf0;font-weight:600;white-space:nowrap}
.xbar-close{flex-shrink:0;background:none;border:none;color:#71767b;font-size:18px;cursor:pointer;padding:2px 6px;line-height:1}
html:not(.xbar-closed) .hd{top:36px}
html.xbar-closed .xbar{display:none}
@media(max-width:600px){.xbar-follow{display:none}.xbar-text{font-size:12px}.hd-r{gap:10px}.back,.xlink{font-size:10px}}
@media(max-width:720px){.hero{padding:30px 0 0}.now-body{font-size:15px}.pv-item{min-width:74px;padding:9px 7px 7px;border-radius:17px;gap:6px}.pv-logo{width:60px;height:38px;flex:0 0 38px}.pv-name{font-size:10.5px;max-width:78px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.now-item{opacity:1;transform:none}}
</style>
<link rel="stylesheet" href="../assets/ios.css">

<body>

<div class="xbar" id="xbar">
  <div class="xbar-inner">
    <a href="https://x.com/SolYoungA" target="_blank" rel="noopener" class="xbar-link">
      <svg class="xbar-logo" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

<script>

<header class="hd">

<main class="container">
  <section class="hero">

<!-- lightbox -->
<div class="lb" id="lb" aria-hidden="true"><button class="lb-close" id="lbClose" aria-label="关闭">×</button><img id="lbImg" alt=""></div>

<script>
(function(){
  var TL = document.getElementById('timeline');
  function fmtDate(d){ var p=d.split('T'); var dt=p[0].split('-'); var out=dt[0]+' / '+dt[1]+' / '+dt[2]; if(p[1]) out+=' · '+p[1]; return out; }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function render(items){
    if(!TL) return;
    var pub = items.filter(function(p){ return p.published; })
      .slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
    var byYear = {};
    pub.forEach(function(p){ var y=p.date.slice(0,4); (byYear[y]=byYear[y]||[]).push(p); });
    TL.innerHTML='';
    var hashTarget = (location.hash||'').slice(1);
    Object.keys(byYear).sort().reverse().forEach(function(year){
      var yh=document.createElement('div');
      yh.className='tl-year';
      yh.innerHTML='<span class="tl-year-num">'+year+'</span><span class="tl-year-line"></span>';
      TL.appendChild(yh);
      byYear[year].forEach(function(post,i){
        var long = post.content.length > 90;
        var el=document.createElement('article');
        el.className='now-item';
        el.id=post.id;
        el.style.transitionDelay=(i*70)+'ms';
        var media='';
        if(post.images && post.images.length){
          media='<div class="now-media"><img src="../'+post.images[0]+'" alt="" loading="lazy"></div>';
        }
        el.innerHTML=
          '<div class="now-head"><img class="now-av" src="../assets/avatar.jpg" alt="SolYoung"><span class="now-name">SolYoung</span><span class="now-handle">@solyoung</span></div>'+
          '<div class="now-meta"><span class="now-type">'+post.type+'</span><span class="now-date">'+fmtDate(post.date)+'</span></div>'+
          '<div class="now-body'+(long?' clamp':'')+'">'+esc(post.content).replace(/\n/g,'<br>')+'</div>'+
          (long?'<button class="rlink" type="button">READ MORE →</button>':'')+
          media;
        TL.appendChild(el);
        var io=new IntersectionObserver(function(es){
          es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
        },{threshold:.12});
        io.observe(el);
        var rl=el.querySelector('.rlink');
        if(rl) rl.addEventListener('click',function(){
          el.querySelector('.now-body').classList.remove('clamp');
          rl.style.display='none';
        });
        if(hashTarget===post.id){
          el.classList.add('in');
          if(rl){ rl.style.display='none'; el.querySelector('.now-body').classList.remove('clamp'); }
        }
      });
    });
    if(hashTarget){
      var t=document.getElementById(hashTarget);
      if(t && !t.classList.contains('in')){ t.classList.add('in'); }
      if(t) setTimeout(function(){ t.scrollIntoView(); },50);
    }
  }
  if(TL){
    fetch('../now.json?v='+Date.now(),{cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(render)
      .catch(function(){ TL.innerHTML='<p class="fail">动态需要在线访问加载。</p>'; });
  }

  // lightbox — click a now image to view at full size
  var lb = document.getElementById('lb');
  if(lb){
    var lbImg = document.getElementById('lbImg');
    var lbClose = document.getElementById('lbClose');
    document.addEventListener('click', function(e){
      var t = e.target;
      if(t && t.matches('.now-media img')){ lbImg.src = t.src; lb.classList.add('open'); }
      else if(lb.classList.contains('open') && (e.target === lb || e.target === lbClose)){ lb.classList.remove('open'); }
    });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') lb.classList.remove('open'); });
  }
})();
</script>

<script>
/* 产品轮播条：9 个产品 logo，无缝自动横移，可拖拽/滑动，悬停暂停 */
(function(){
  var rail = document.getElementById('prRail');
  var track = document.getElementById('prTrack');
  if(!rail || !track) return;

  var P = [
    {n:'LunaSol',         s:'lunasol',         f:'lunasol.png'},
    {n:'My.OS',           s:'myos',            f:'myos.png'},
    {n:'Verity',          s:'verity',          f:'verity.png'},
    {n:'CamSim',          s:'camsim',          f:'camsim.png'},
    {n:'SolClip',         s:'solclip',         f:'solclip.png'},
    {n:'X Insight',       s:'xinsight',        f:'xinsight.png'},
    {n:'OFX Atlas',       s:'ofx-atlas',       f:'ofx-atlas.png'},
    {n:'SolYoung Studio', s:'solyoung-studio', f:'solyoung-studio.png'},
    {n:'SolYoung',        s:'solyoung',        f:'solyoung.png'}
  ];

  var BASE = 'https://solhub.solyoung.top/products/';
  var html = '';
  for(var i=0;i<P.length;i++){
    var p = P[i];
    html += '<a class="pv-item" href="' + BASE + p.s + '/" target="_blank" rel="noopener">' +
      '<span class="pv-logo"><img src="../assets/products/' + p.f + '" alt="' + p.n + '" width="42" height="42" decoding="async"></span>' +
      '<span class="pv-name">' + p.n + '</span></a>';
  }
  track.innerHTML = html + html;          // 两份，用于无缝回绕

  var half = 0;
  function measure(){
    var one = track.scrollWidth / 2;
    // 一份内容不够宽时再补一份，保证能滚满一个周期
    if(one < rail.clientWidth + 80){
      track.innerHTML += html;
      while(track.scrollWidth / 3 < rail.clientWidth + 80 && track.children.length < P.length * 4){
        track.innerHTML += html;
      }
    }
    var copies = Math.round(track.children.length / P.length) || 1;
    half = track.scrollWidth / copies;
  }
  measure();
  window.addEventListener('resize', measure);
  window.addEventListener('load', measure);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SPEED = 34;              // px / 秒
  var paused = false, dragging = false, last = 0, holdUntil = 0;
  var sx = 0, sl = 0, pos = 0; // pos 是浮点累加器：scrollLeft 只会取整，靠它保住亚像素增量

  function wrap(v){
    if(half <= 0) return v;
    while(v >= half) v -= half;
    while(v < 0) v += half;
    return v;
  }

  function frame(t){
    if(!last) last = t;
    var dt = Math.min(64, t - last);
    last = t;
    if(!reduce && !paused && !dragging && t > holdUntil && half > 0){
      var cur = rail.scrollLeft;
      if(Math.abs(cur - pos) > 3) pos = cur;   // 用户手动滚过，接上真实位置
      pos = wrap(pos + SPEED * dt / 1000);
      rail.scrollLeft = pos;
    }else{
      pos = rail.scrollLeft;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* 悬停暂停（鼠标） */
  rail.addEventListener('pointerenter', function(e){
    if(e.pointerType === 'mouse') paused = true;
  });
  rail.addEventListener('pointerleave', function(){
    if(!dragging){ paused = false; last = 0; }
  });

  /* 拖拽（鼠标 / 触屏以外的指针）；触屏交给原生滚动 */
  rail.addEventListener('pointerdown', function(e){
    if(e.pointerType === 'touch'){
      holdUntil = performance.now() + 2600;
      paused = false;
      return;
    }
    if(e.button !== 0) return;
    dragging = true; paused = true;
    sx = e.clientX; sl = rail.scrollLeft;
    rail.classList.add('dragging');
    try{ rail.setPointerCapture(e.pointerId); }catch(err){}
  });
  rail.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var target = sl - (e.clientX - sx);
    if(half > 0){
      var max = track.scrollWidth - rail.clientWidth;
      while(target < 0) target += half;
      while(target > max) target -= half;
    }
    rail.scrollLeft = target;
  });
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    rail.classList.remove('dragging');
    holdUntil = performance.now() + 900;
  }
  rail.addEventListener('pointerup', endDrag);
  rail.addEventListener('pointercancel', endDrag);

  /* 触屏原生滑动结束后，把位置归一到周期内，避免停在周期外卡住 */
  rail.addEventListener('scroll', function(){
    if(dragging || half <= 0) return;
    var max = track.scrollWidth - rail.clientWidth;
    if(rail.scrollLeft > max - 2 && rail.scrollLeft >= half) rail.scrollLeft -= half;
  }, {passive:true});
})();
</script>
